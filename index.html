/* A bee hint may point at the rule, but it must never hand over the word —
   no printing it, no spelling it out, in text or in speech. */
function beeSafeTip(tip, word){
  const w = String(word).toLowerCase();
  const clean = s => {
    let out = speakableText(s);
    out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), '\u2022\u2022\u2022');
    // kill letter-by-letter giveaways: "s, a, i, d" / "s-a-i-d" / "w a s"
    out = out.replace(/\b[a-z](?:\s*[,\-]\s*[a-z]\b){2,}/gi, '\u2022\u2022\u2022');
    return out;
  };
  return { title: clean(tip.title), rule: clean(tip.rule), trick: clean(tip.trick) };
}
function speakableText(h){ return String(h).replace(/<[^>]+>/g,''); }

/* ---------------- kid: on stage at the bee ---------------- */
const RIVALS = ['🐛','🦗','🐞','🦋','🐌','🐜','🕷️','🦂','🐝','🦟','🪲','🐢'];

function actBeePlay(a){
  buildBee();
  const d = { key:'bee', n:'The Spelling Bee', t:'You\'re on stage', em:'🎤', sub:'Spell it right and a rival sits down' };
  BACK_TO = 'bee';
  dayHeader(a, d);
  MISSED = [];

  let words = beeSessionWords();
  if (!words.length){ a.appendChild(el('<div class="card center"><h2>Nothing to practise!</h2></div>')); return; }

  const host = el('<div></div>'); a.appendChild(host);
  const started = Date.now();
  let i = 0, right = 0, asked = 0, extended = false;
  let field = Math.min(12, words.length);        // rivals on stage
  let out = 0;                                   // how many we've knocked out

  function overTime(){ return (Date.now() - started) > BEE_SESSION_MS; }

  function stageHTML(sub){
    const crowd = RIVALS.slice(0, field).map((r,ix) =>
      '<span class="'+(ix < out ? 'out' : '')+'">'+r+'</span>').join('');
    return '<div class="stage">'+
      '<div class="spot"></div>'+
      '<div class="rnd">ROUND '+(asked+1)+'</div>'+
      '<div class="micon">🎤</div>'+
      '<div class="rivals">'+Math.max(0, field-out)+' speller'+(field-out===1?'':'s')+' still standing</div>'+
      '<div class="crowd">'+crowd+'</div>'+
      (sub ? '<div class="rivals" style="margin-top:8px;opacity:.85">'+sub+'</div>' : '')+
    '</div>';
  }

  function next(){
    if (i >= words.length || (overTime() && !extended)) return maybeStop();
    const w = words[i];
    const st = beeStat(w.word);
    host.innerHTML = '';
    if (!st.seen) return study(w);
    return onStage(w, (st.x > 0 && st.run === 0) ? makeBlanks(w.word, w.patternId, isHard()?2:1) : null);
  }

  /* a brand-new word gets a study card first — backstage, before the round */
  function study(w){
    const c = el('<div class="card center">'+
      '<div class="muted">🐝 Backstage · a new word</div>'+
      '<div class="bigword">'+highlight(w.word, w.patternId)+'</div>'+
      '<div class="speaker" id="sp">🔊</div>'+
      '<div class="tip" style="margin-top:14px"><h3>💡 '+w.tip.title+'</h3><p>'+w.tip.rule+'</p>'+
      '<p class="trick">'+w.tip.trick+'</p></div>'+
      '<div class="row" style="justify-content:center"><button class="btn grey" id="sl">🐢 Slowly</button>'+
      '<button class="btn grey" id="hr">🔊 Hear the rule</button></div>'+
      '<button class="btn big yellow" id="ok" style="margin-top:12px">🎤 Ready — call me up!</button></div>');
    host.appendChild(c);
    const sp = c.querySelector('#sp');
    const play = () => { sp.classList.add('playing'); sayWord(w.word, {onend:()=>sp.classList.remove('playing')}); };
    sp.onclick = play;
    c.querySelector('#sl').onclick = () => saySlow(w.word);
    c.querySelector('#hr').onclick = () => sayRule(w.tip.title+'. '+w.tip.rule+' '+w.tip.trick);
    c.querySelector('#ok').onclick = () => { sfx('tap'); beeStat(w.word).seen++; save(); onStage(w, null, true); };
    setTimeout(play, 300);
  }

  /* the real thing: judge announces the word, kid may ask the bee questions */
  function onStage(w, blanks, fresh){
    host.innerHTML = '';
    const c = el('<div>'+ stageHTML('') +
      '<div class="card" style="margin-top:12px">'+
        '<div class="judge">🧑‍⚖️ Your word is… <b id="jw">📣</b></div>'+
        '<div class="askbacks">'+
          '<button id="ab-rep">🔁 Repeat it</button>'+
          '<button id="ab-slow">🐢 Slowly, please</button>'+
          '<button id="ab-rule">💡 Any hints?</button>'+
        '</div>'+
        '<p class="muted center" style="margin-top:8px">'+
          (blanks ? 'Some letters are already up on the board.' : 'Spell it for the judges.')+'</p>'+
      '</div></div>');
    host.appendChild(c);

    const announce = () => { c.querySelector('#jw').textContent = '📣'; sayWord(w.word); };
    c.querySelector('#ab-rep').onclick  = () => { sfx('tap'); announce(); };
    c.querySelector('#ab-slow').onclick = () => { sfx('tap'); saySlow(w.word); };
    c.querySelector('#ab-rule').onclick = () => { sfx('tap'); rulePopup(beeSafeTip(w.tip, w.word), true); };
    setTimeout(announce, fresh ? 550 : 350);

    const card = c.querySelector('.card');
    typingRound(card, {
      word:w.word, patternId:w.patternId, blanks: blanks, noStats:true, noSpell:true,
      onDone: ok => {
        beeMark(w.word, ok);
        if (ok){
          right++;
          if (out < field) out++;
          sfx('clap');
          toast(out >= field ? '🏆 You are the last one standing!' : '👏 Correct! A rival sits down.', 2400);
        } else {
          noteMiss(w.word);
          sfx('buzz');
          toast('🔔 The judges say: keep that one on your list.', 2600);
        }
        asked++; i++;
        setTimeout(next, 900);
      }
    });
  }

  function maybeStop(){
    const p = beeProg();
    p.days[today()] = { asked, right, when: today() };
    save();
    if (i >= words.length) return finish();
    host.innerHTML = '';
    sfx('ding');
    const c = el('<div class="card center">'+
      '<div style="font-size:52px">🎬</div><h2>Intermission!</h2>'+
      '<p class="muted">Ten minutes on stage, and '+right+' of '+asked+' spelled right. '+
      'That\'s a proper practice — but the judges will hear more if you want to carry on.</p>'+
      '<button class="btn big green" id="stop" style="margin-top:10px">✅ That\'s me for today</button>'+
      '<button class="btn big blue" id="more" style="margin-top:10px">🎤 One more round!</button></div>');
    c.querySelector('#stop').onclick = () => { sfx('tap'); finish(); };
    c.querySelector('#more').onclick = () => { sfx('tap'); extended = true; next(); };
    host.appendChild(c);
  }

  function finish(){
    const p = beeProg();
    p.days[today()] = { asked, right, when: today(), done:true };
    save();
    host.innerHTML = '';
    const champ = out >= field;
    if (champ) confetti(140);
    sfx(champ ? 'win' : 'good');
    const c = el('<div class="card center">'+
      '<div style="font-size:56px">'+(champ ? '🏆' : '🐝')+'</div>'+
      '<h2 style="font-size:24px">'+(champ ? 'Champion of the bee!' : 'Great round on stage!')+'</h2>'+
      '<p class="muted">'+out+' rival'+(out===1?'':'s')+' knocked out · '+right+' of '+asked+' spelled right</p>'+
      '<button class="btn big green" id="on" style="margin-top:12px">Next →</button></div>');
    c.querySelector('#on').onclick = () => beeFinishScreen(right, Math.max(1, asked));
    host.appendChild(c);
  }

  next();
}

/* the bee's own reward flow — paper practice, then stars */
function beeFinishScreen(correct, total){
  const d = { key:'bee', n:'Spelling Bee', t:'Today\'s practice', em:'🐝', sub:'Paper practice' };
  const pct = Math.round(100*correct/total);
  const st = stars(pct);
  const xp = correct*10 + (st===3?30:st===2?15:5);
  const k = kid();
  k.xp = (k.xp||0) + xp;
  const tdy = new Date().toISOString().slice(0,10);
  if (k.lastDay !== tdy){
    const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
    k.streak = (k.lastDay === y) ? (k.streak||0)+1 : 1;
    k.lastDay = tdy;
  }
  award('first');
  if (k.streak >= 3) award('streak3');
  if (k.streak >= 7) award('streak7');
  if (level(k) >= 5) award('level5');
  save();

  writeItScreenBee(d, () => {
    confetti(90); sfx(st === 3 ? 'win' : 'good');
    const p = popup(
      '<div class="em">'+(st===3?'🏆':st===2?'🎉':'👍')+'</div>'+
      '<h2 style="font-size:26px">'+(st===3?'Brilliant!':st===2?'Great job!':'Good effort!')+'</h2>'+
      '<div style="font-size:42px;letter-spacing:4px">'+'⭐'.repeat(st)+'<span style="opacity:.2">'+'⭐'.repeat(3-st)+'</span></div>'+
      '<p style="font-size:19px;font-weight:800;margin:10px 0 2px">'+correct+' / '+total+' right</p>'+
      '<p class="muted">+'+xp+' stars</p>'+
      '<button class="btn big green" style="margin-top:14px" data-close>Back to the bee</button>');
    p.addEventListener('click', e => { if (e.target.dataset.close !== undefined) go('bee'); });
  });
}

/* same paper step as the weekly days, but it returns to the bee */
function writeItScreenBee(d, done){
  const a = app();
  BACK_TO = 'bee';
  a.innerHTML = '';
  dayHeader(a, d, 'Paper practice');
  const missed = MISSED.slice(0, 4);
  const gotAll = missed.length === 0;
  const list = gotAll ? shuffle(BEE.allWords).slice(0,2).map(w=>w.word) : missed;

  const c = el('<div class="card center">'+
    '<div style="font-size:52px">✍️</div><h2 style="font-size:24px">Paper time!</h2>'+
    '<p style="font-size:17px;line-height:1.5">'+
      (gotAll ? 'Not a single miss today! 🌟<br>Pick up a pencil and write these <b>2</b> words <b>5 times each</b>.'
              : 'These are the ones that tricked you today. Write each one <b>5 times</b> on paper.')+'</p>'+
    '<p class="muted">Tap a star each time you finish writing one.</p>'+
    '<div id="rows" style="margin-top:14px"></div>'+
    '<button class="btn big green" id="wdone" disabled>All done! ✅</button></div>');
  a.appendChild(c);

  const pr = beeProg();
  pr.write = pr.write || {};
  const prev = pr.write[today()];
  const state = {};
  list.forEach(w => state[w] = (prev && prev.counts && prev.counts[w]) || 0);
  pr.write[today()] = { words:list.slice(), counts:state, done:false, when:today() };
  save();

  const rows = c.querySelector('#rows'), btn = c.querySelector('#wdone');
  function draw(){
    rows.innerHTML = '';
    list.forEach(w => {
      const r = el('<div class="writerow"><div class="ww">'+esc(w)+' <span class="sp">🔊</span></div><div class="tally"></div></div>');
      r.querySelector('.ww').onclick = () => sayWord(w);
      const t = r.querySelector('.tally');
      for (let i=0;i<5;i++){
        const on = i < state[w];
        const b = el('<button class="tk'+(on?' on':'')+'">'+(on?'⭐':'☆')+'</button>');
        b.onclick = () => { state[w] = (i < state[w]) ? i : i+1; pr.write[today()].counts = state; save(); sfx('write'); draw(); };
        t.appendChild(b);
      }
      rows.appendChild(r);
    });
    const all = list.every(w => state[w] >= 5);
    btn.disabled = !all;
    if (all) btn.textContent = 'All done! ✅  +25 ⭐';
  }
  draw();
  btn.onclick = () => {
    pr.write[today()].done = true;
    const k = kid(); k.xp = (k.xp||0) + 25; save();
    award('writer'); sfx('great'); done();
  };
}

/* ---------------- kid: speed round over the whole list ---------------- */
function actBeeSpeed(a){
  buildBee();
  const d = { key:'speed', n:'Speed Round', t:'The whole list', em:'⚡', sub:'How fast can you go?' };
  BACK_TO = 'bee';
  dayHeader(a, d);
  const host = el('<div></div>'); a.appendChild(host);
  const all = BEE.allWords.slice();
  if (!all.length) return;

  let queue = shuffle(all), i = 0, score = 0, hits = 0;
  const t0 = Date.now();

  function step(){
    if (i >= queue.length) return done();
    const w = queue[i];
    const others = shuffle(all.filter(x => x.word !== w.word)).slice(0,3).map(x => x.word);
    let opts = shuffle([w.word].concat(others));
    if (opts.length < 2) opts = [w.word].concat(misspell(w.word, w.patternId).slice(0,2));
    host.innerHTML = '';
    const c = el('<div class="card center">'+
      '<div class="muted">⚡ '+(i+1)+' of '+queue.length+' · '+hits+' right</div>'+
      '<div class="fuel" style="margin-top:8px"><i style="width:'+Math.round(100*i/queue.length)+'%"></i></div>'+
      '<div class="speaker" id="sp" style="margin-top:12px">🔊</div>'+
      '<p style="font-weight:800;margin-top:12px">Which word did you hear?</p><div id="ops"></div></div>');
    host.appendChild(c);
    c.querySelector('#sp').onclick = () => sayWord(w.word);
    sayWord(w.word);
    const ops = c.querySelector('#ops');
    opts.forEach(o => {
      const b = el('<button class="btn big blue" style="margin-bottom:8px">'+esc(o)+'</button>');
      b.onclick = () => {
        const ok = o === w.word;
        if (ok){ hits++; score += 10; sfx('good'); b.className='btn big green'; }
        else { sfx('wrong'); b.className='btn big red'; noteMiss(w.word);
               Array.from(ops.children).forEach(x=>{ if(x.textContent===w.word) x.className='btn big green'; }); }
        beeMark(w.word, ok);
        ops.querySelectorAll('button').forEach(x=>x.disabled=true);
        i++; setTimeout(step, ok ? 420 : 1200);
      };
      ops.appendChild(b);
    });
  }

  function done(){
    const secs = Math.round((Date.now()-t0)/1000);
    confetti(80); sfx('win');
    const p = popup('<div class="em">⚡</div><h2>Speed round done!</h2>'+
      '<p style="font-size:19px;font-weight:800">'+hits+' / '+queue.length+' right</p>'+
      '<p class="muted">in '+Math.floor(secs/60)+'m '+(secs%60)+'s</p>'+
      '<button class="btn big green" style="margin-top:12px" data-close>Back to the bee</button>');
    const k = kid(); k.xp = (k.xp||0) + hits*3; save();
    p.addEventListener('click', e => { if (e.target.dataset.close !== undefined) go('bee'); });
  }
  step();
}

    '<small>'+plan.mastered.length+' of '+plan.words.length+' mastered'+
    (plan.daysLeft != null ? ' · '+plan.daysLeft+' days to go' : '')+'</small></div></button>');
  bee.onclick = () => { sfx('tap'); go('bee'); };
  a.appendChild(bee);

  const foot = el('<div class="center" style="margin-top:16px"><button class="btn ghost">⚙️ Grown-ups</button></div>');
  foot.querySelector('button').onclick = parentGate;
  a.appendChild(foot);
}

</script>
</body>
</html>
