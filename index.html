<style>
/* ===================== SPELLING QUEST ===================== */
:root{
  --bg:#1a1040;
  --bg2:#2d1b69;
  --card:#ffffff;
  --ink:#251a4a;
  --ink-soft:#6b5f92;
  --line:#e8e3f7;
  --brand:#7c3aed;
  --brand2:#a855f7;
  --pink:#ff5fa2;
  --yellow:#ffc93c;
  --green:#22c98b;
  --red:#ff6b6b;
  --blue:#3ba9ff;
  --orange:#ff9445;
  --r:22px;
  --shadow:0 10px 0 rgba(0,0,0,.14);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Baloo 2", "Comic Sans MS", system-ui, -apple-system, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 700px at 15% -10%, #4c1d95 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 0%, #1e40af 0%, transparent 55%),
    linear-gradient(170deg,#221252 0%,#160c33 100%);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  user-select:none;
  -webkit-user-select:none;
}
button{ font-family:inherit; cursor:pointer; border:none; }
input,textarea{ font-family:inherit; }

/* floating stars background */
.stars{ position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5; }
.stars i{ position:absolute; font-style:normal; animation:float 9s ease-in-out infinite; }
@keyframes float{ 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-18px) rotate(12deg)} }

.wrap{ position:relative; z-index:1; max-width:820px; margin:0 auto; padding:14px 14px 60px; }

/* ---------- generic bits ---------- */
.card{
  background:var(--card); border-radius:var(--r); padding:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.28); margin-bottom:14px;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--brand); color:#fff; font-weight:800; font-size:18px;
  padding:16px 22px; border-radius:18px; box-shadow:0 5px 0 rgba(0,0,0,.22);
  transition:transform .08s, box-shadow .08s; min-height:56px;
}
.btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.22); }
.btn.big{ width:100%; font-size:22px; padding:20px; }
.btn.green{ background:var(--green); } .btn.pink{ background:var(--pink); }
.btn.blue{ background:var(--blue); } .btn.yellow{ background:var(--yellow); color:#4a3200; }

.writerow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between;

.writerow .ww .sp{ font-size:17px; }
.tally{ display:flex; gap:4px; }

.tally .tk.on{ background:linear-gradient(150deg,#fff2c9,#ffd76e); }

.rocketbox{ position:relative; height:150px; margin:6px 0 4px;

.btn.link{ background:transparent; color:var(--ink-soft); box-shadow:none; font-size:15px;

.pindots{ display:flex; gap:12px; justify-content:center; margin:14px 0 18px; }

.hive{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:12px 0 6px; }

<script>
/* ============================================================
   PHONICS ENGINE
   Turns a raw list of spelling words into:
     - sections grouped by pattern ("igh words", "ie words"...)

     - flashcard chunks for each word  (night -> n | igh | t)
     - missing-letter puzzles          (night -> n _ _ _ t)

/* Each pattern:
   id     - stable key
   label  - section heading shown to kids

   len    - length of the matched grapheme
*/

const PATTERNS = [
  // ---------- silent letters / digraphs (most specific first) ----------
  { id:'igh', label:'igh words', g:'igh',
    title:'igh sounds like the letter <b>i</b>', rule:'The <b>gh</b> is totally silent — it just sits there!',
    trick:'The l<b>igh</b>t in the n<b>igh</b>t is br<b>igh</b>t.', emoji:'🌙' },

  { id:'ough', label:'ough words', g:'ough',

  { id:'augh', label:'augh words', g:'augh',

  { id:'tion', label:'-tion words', g:'tion',

  { id:'sion', label:'-sion words', g:'sion',

  { id:'ture', label:'-ture words', g:'ture',

  { id:'dge', label:'dge words', g:'dge',
    title:'Use dge after a short vowel', rule:'If the vowel is short and it\'s the end of the word, use <b>dge</b>.',

  { id:'wr', label:'wr words', g:'wr', start:true,

/* ---------- helpers ---------- */

function isVowel(c){ return 'aeiou'.indexOf(c) >= 0; }

function hasMagicE(w){
  if (w.length < 4) return false;
  if (w[w.length-1] !== 'e') return false;
  const c = w[w.length-2], v = w[w.length-3];
  if (!isVowel(v)) return false;
  if (isVowel(c) || c === 'e') return false;
  if (/(le|se|ce|ge|ve|ze)$/.test(w) && !isVowel(w[w.length-3])) return false;
  return true;
}

/* Find where a pattern sits inside a word. Returns {i, len} or null. */
/* A closed syllable: one vowel, shut in by consonants, so it says its short
   sound. This is what almost every Year 1 / Grade 1 list is built on — cat, sat,
   mat — and without it those words fell through as "no rule, learn by heart",
   which is both wrong and the opposite of what the app is for. */
function shortVowelWord(w, v){
  w = String(w || '').toLowerCase();
  if (!/^[a-z]{2,5}$/.test(w)) return null;
  const vowels = w.match(/[aeiou]/g) || [];
  if (vowels.length !== 1 || vowels[0] !== v) return null;
  if (w.endsWith('e')) return null;                 // that's magic e's job
  if (!/[bcdfghjklmnpqrstvwxyz]/.test(w)) return null;
  const i = w.indexOf(v);
  if (i === w.length - 1 && w.length > 2) return null;   // needs shutting in
  return { i, len:1 };
}

function matchPattern(word, p){
  const w = word.toLowerCase();
  if (p.custom === 'magic_e') return hasMagicE(w) ? {i:w.length-3, len:3} : null;
  if (p.custom && p.custom.indexOf('short_') === 0)
    return shortVowelWord(w, p.custom.slice(6));
  if (!p.g) return null;
  if (p.start) return w.indexOf(p.g) === 0 ? {i:0, len:p.g.length} : null;
  if (p.end)   return w.endsWith(p.g) && w.length > p.g.length + 1
                  ? {i:w.length-p.g.length, len:p.g.length} : null;
  const i = w.indexOf(p.g);
  return i >= 0 ? {i, len:p.g.length} : null;
}

/* Which pattern best describes this word (used only as a fallback). */
function detectPattern(word){
  for (const p of PATTERNS){
    if (matchPattern(word, p)) return p.id;
  }
  return 'misc';
}

/* ---------- grouping ----------
   Given a list of words, find the pattern(s) that the WEEK is built on:
   a pattern only becomes a section if 2+ words share it (or it's the only
   thing we've got). This stops "the" from creating a "th words" section. */
function groupWords(words){
  const counts = {};
  /* Words with a hand-written explanation must never be swept into a phonics
     pattern. "was" looks like a short-a word and isn't — it says "wuz" — and
     teaching it as one would be worse than teaching nothing. */
  words = words.slice();
  const byHeart = words.filter(w => TRICKY[String(w).toLowerCase()]);
  const rest    = words.filter(w => !TRICKY[String(w).toLowerCase()]);
  words = rest;
  words.forEach(w => {
    PATTERNS.forEach(p => {
      if (matchPattern(w, p)){
        (counts[p.id] = counts[p.id] || []).push(w);
      }
    });
  });

  const order = PATTERNS.map(p => p.id);
  const claimed = {};
  const sections = [];

  // pass 1: patterns shared by 2+ words, most specific pattern first
  order.forEach(id => {
    const list = (counts[id] || []).filter(w => !claimed[w]);
    if (list.length >= 2){
      list.forEach(w => claimed[w] = id);
      sections.push({ patternId:id, words:list.slice() });
    }
  });

  // pass 2: singles — join a matching section, or start their own
  words.forEach(w => {
    if (claimed[w]) return;
    const pid = detectPattern(w);
    if (pid === 'misc') return;
    const existing = sections.find(s => s.patternId === pid);
    if (existing) existing.words.push(w);
    else sections.push({ patternId:pid, words:[w] });
    claimed[w] = pid;
  });

  // pass 3: words that follow no pattern at all get their OWN rule, one each —
  // never a nameless "extra words" bucket.
  byHeart.forEach(w => {
    claimed[w] = 'tricky:' + String(w).toLowerCase();
    sections.push({ patternId:'tricky:' + String(w).toLowerCase(), words:[w] });
  });

  words.forEach(w => {
    if (claimed[w]) return;
    claimed[w] = 'tricky';
    sections.push({ patternId:'tricky:'+w, words:[w] });
  });

  return sections;
}

/* ---------- chunking (Tuesday flashcards) ---------- */

/* common little words, used to split compounds nicely (something -> some|thing) */
const COMMON = ('a about after all also an and any are as at back be been before big but by call can come could day did do down each even every find first for from get give go good great had has have he her here him his how i if in into is it its just know last like little long look made make man many may me more most much must my never new no not now of off old on one only or other our out over own part people place put right said same say see she should show small so some take tell than that the their them then there these they thing think this those thought three through time to too two under up us use very want was way we well went were what when where which while who why will with word work would year you your'
  + ' thing think one time body where way self ever some any every no where how ball fall foot ball house hold play ground birth day sun light moon rain bow snow man mail box tooth brush class room bed room some what up on in to out side in side after noon week end her self him self my self note book back pack pop corn butter fly straw berry rail road side walk basket ball foot ball base ball fire man police man').split(/\s+/);
const COMMON_SET = {}; COMMON.forEach(w => { if (w.length >= 2) COMMON_SET[w] = 1; });

const DIGRAPHS = ['igh','tch','dge','sch','shr','thr','ch','sh','th','ph','wh','ck','ng','qu','gh','wr','kn'];
/* would a split between i-1 and i cut a digraph in half? */
function cutsDigraph(w, i){
  for (const d of DIGRAPHS){
    for (let s = Math.max(0, i - d.length + 1); s <= i - 1; s++){
      if (w.substr(s, d.length) === d && s < i && s + d.length > i) return true;
    }
  }
  return false;
}

/* compound word split: something -> some | thing */
function compoundSplit(w){
  if (w.length < 6) return null;
  for (let i = 3; i <= w.length - 3; i++){
    const a = w.slice(0,i), b = w.slice(i);
    if (COMMON_SET[a] && COMMON_SET[b]) return [a,b];
  }
  return null;
}

/* how many beats does this word have? (vowel groups, minus a silent e) */
function beats(w){
  const m = String(w).toLowerCase().match(/[aeiouy]+/g) || [];
  let n = m.length;
  if (/[^aeiou]e$/.test(w) && n > 1) n--;
  return Math.max(1, n);
}

/* Real syllables, for READING ALOUD. One-beat words are never broken up —
   splitting "light" into l·igh·t sounds like letters, not speech. */
function speechSyllables(w){
  w = String(w).toLowerCase();
  if (beats(w) < 2) return [w];
  const comp = compoundSplit(w);
  if (comp) return comp;
  let parts = syllableSplitCore(w);
  // a fragment with no vowel, or a tiny tail like "re"/"se", sounds wrong on its own
  const merged = [];
  parts.forEach(p => {
    if (merged.length && !/[aeiouy]/.test(p)) merged[merged.length-1] += p;
    else merged.push(p);
  });
  while (merged.length > 1 && merged[merged.length-1].length <= 2)
    merged[merged.length-2] += merged.pop();
  return merged.length >= 2 ? merged : [w];
}

/* crude but decent syllable splitter, used when there is no pattern to split on */
function syllableSplit(w){
  const comp = compoundSplit(w);
  if (comp) return comp;
  const parts = syllableSplitCore(w);
  if (parts.length === 1) return onsetRime(w);
  return parts.length ? parts : [w];
}

function syllableSplitCore(w){
  const parts = [];
  let cur = '';
  for (let i = 0; i < w.length; i++){
    cur += w[i];
    const next = w[i+1], nn = w[i+2];
    if (!next) break;
    if (cutsDigraph(w, i+1)) continue;
    // VC | CV  (rabbit -> rab|bit)
    if (isVowel(w[i-1]) && !isVowel(w[i]) && next && !isVowel(next) && nn && isVowel(nn) && cur.length >= 2){
      parts.push(cur); cur = ''; continue;
    }
    // V | CV  (open -> o|pen) — only for longer words, and not right at the start
    if (isVowel(w[i]) && next && !isVowel(next) && nn && isVowel(nn) && w.length > 5 && cur.length >= 3){
      parts.push(cur); cur = ''; continue;
    }
  }
  if (cur) parts.push(cur);
  return parts;
}

/* last resort: split a short word into its starting consonants + the rest */
function onsetRime(w){
  if (w.length < 3) return [w];
  let i = 0;
  while (i < w.length && !isVowel(w[i])) i++;
  if (i === 0) i = 1;                    // starts with a vowel
  if (i >= w.length - 1) i = Math.max(1, w.length - 2);
  return [w.slice(0,i), w.slice(i)];
}

/* Split a word into 2–3 flashcard chunks, keeping the week's pattern intact. */
function chunkWord(word, patternId){
  const w = word.toLowerCase();
  const p = PATTERN_BY_ID[patternId];
  if (p){
    const m = matchPattern(w, p);
    if (m){
      const before = w.slice(0, m.i);
      const target = w.slice(m.i, m.i + m.len);
      const after  = w.slice(m.i + m.len);
      const out = [before, target, after].filter(Boolean);
      if (out.length >= 2){
        if (out.every(c => c.length <= 4)) return out;
        // a piece is long and clumsy — try syllabifying the whole word instead,
        // but only if that doesn't chop the week's pattern in half
        const syl = syllableSplit(w);
        if (syl.length >= 2 && syl.every(c => c.length <= 5) &&
            syl.some(c => c.indexOf(target) >= 0)) return syl.slice(0,4);
        return out.slice(0,4);
      }
    }
  }
  return syllableSplit(w).slice(0,4);
}

/* ---------- missing letters (Wednesday) ---------- */

/* level: 1 = blank the pattern only, 2 = pattern + 1, 3 = pattern + 2 */
function makeBlanks(word, patternId, level){
  const w = word.toLowerCase();
  const blanks = new Set();
  const p = PATTERN_BY_ID[patternId];
  const m = p ? matchPattern(w, p) : null;
  if (m && p.custom === 'magic_e'){
    // cake -> c _ k _   (show the consonant, hide the vowel and the magic e)
    blanks.add(m.i); blanks.add(w.length - 1);
  } else if (m){
    for (let i = m.i; i < m.i + m.len && i < w.length; i++) blanks.add(i);
    // for -ing / -ed, also hide the doubled consonant so the 1-1-1 rule gets tested
    if ((p.id === 'ing' || p.id === 'ed') && m.i >= 2 && w[m.i-1] === w[m.i-2] && !isVowel(w[m.i-1])){
      blanks.add(m.i-1);
    }
  }
  if (!blanks.size){
    // blank the vowels
    for (let i = 0; i < w.length; i++) if (isVowel(w[i])) blanks.add(i);
  }
  // never hide more than ~55% of a word, and always leave at least 2 letters showing
  const maxBlanks = Math.max(blanks.size, Math.min(w.length - 2, Math.ceil(w.length * 0.55)));
  const extra = Math.max(0, Math.min((level || 1) - 1, maxBlanks - blanks.size));
  if (extra > 0){
    // deterministic "random": pick spread-out positions not already blanked
    const free = [];
    for (let i = 1; i < w.length; i++) if (!blanks.has(i)) free.push(i);
    let seed = 0; for (let i=0;i<w.length;i++) seed += w.charCodeAt(i);
    for (let k = 0; k < extra && free.length; k++){
      const idx = (seed + k * 7) % free.length;
      blanks.add(free[idx]);
      free.splice(idx,1);
    }
  }
  // never blank the whole word
  if (blanks.size >= w.length) blanks.delete(0);
  return Array.from(blanks).sort((a,b)=>a-b);
}

/* ---------- build a full week ---------- */

function buildWeek(rawText, meta){
  const parsed = parseWordText(rawText);
  const sections = [];

  parsed.forEach(block => {
    if (block.heading){
      // parent gave us an explicit heading — still detect the pattern for rules
      const guess = bestPatternForHeading(block.heading, block.words);
      sections.push({ patternId: guess, label: block.heading, words: block.words });
    } else {
      groupWords(block.words).forEach(s => sections.push(s));
    }
  });

  return {
    id: (meta && meta.id) || 'week',
    title: (meta && meta.title) || autoTitle(sections),
    created: (meta && meta.created) || null,
    sections: sections.map(s => {
      const p = patternFor(s.patternId);
      return {
        patternId: s.patternId,
        label: s.label || p.label,
        emoji: p.emoji,
        tip: { title:p.title, rule:p.rule, trick:p.trick },
        words: s.words.map(w => ({
          word: w,
          chunks: chunkWord(w, s.patternId),
          display: w
        }))
      };
    })
  };
}

function trickyPattern(w){
  const t = TRICKY[w];
  const spelled = w.split('').join('-');
  if (t) return { id:'tricky:'+w, label:'the word \u201c'+w+'\u201d', emoji:t.em,
                  title:'\u201c'+t.title+'\u201d', rule:t.rule, trick:t.trick };
  return { id:'tricky:'+w, label:'the word \u201c'+w+'\u201d', emoji:'\ud83d\udc9b',
    title:'\u201c'+w+'\u201d is a heart word',
    rule:'This one doesn\'t follow a spelling rule — you learn it by heart, like a friend\'s name.',
    trick:'Look \u00b7 Say \u00b7 Cover \u00b7 Write \u00b7 Check. Now spell it out loud: <b>'+spelled+'</b>' };
}

function patternFor(id){
  if (PATTERN_BY_ID[id]) return PATTERN_BY_ID[id];
  if (id && id.indexOf('tricky:') === 0) return trickyPattern(id.slice(7));
  return MISC_PATTERN;
}

function bestPatternForHeading(heading, words){
  const h = heading.toLowerCase().replace(/[^a-z]/g,'');
  // "ie words" -> "iewords"; try to find a pattern id inside it
  let best = null;
  PATTERNS.forEach(p => {
    if (p.g && h.indexOf(p.g) === 0){
      if (!best || p.g.length > PATTERN_BY_ID[best].g.length) best = p.id;
    }
  });
  if (best) return best;
  const g = groupWords(words);
  return g.length ? g[0].patternId : 'misc';
}

function autoTitle(sections){
  const labels = sections.map(s => patternFor(s.patternId).label.replace(' words','').replace('the word ',''));
  if (!labels.length) return 'This Week';
  if (labels.length === 1) return labels[0] + ' words';
  return labels.slice(0,3).join(' · ') + ' words';
}

/* Accepts:
     light night right
     ie words:
     field chief
     - one word per line
     - commas, spaces or newlines
*/
function parseWordText(text){
  const lines = String(text || '').split(/\r?\n/);
  const blocks = [];
  let cur = { heading:null, words:[] };
  lines.forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    const isHeading = /[:：]\s*$/.test(line) ||
                      (/^[a-zA-Z' \-]+$/.test(line) && /\b(words?|list|section|group|pattern|sound)\b/i.test(line) && line.split(/\s+/).length <= 4);
    if (isHeading){
      if (cur.words.length) blocks.push(cur);
      cur = { heading: line.replace(/[:：]\s*$/,'').trim(), words: [] };
      return;
    }
    line.split(/[,;\/\t]+|\s+/).forEach(tok => {
      const w = tok.replace(/[^A-Za-z'\-]/g,'').trim();
      if (w.length >= 2) cur.words.push(w.toLowerCase());
    });
  });
  if (cur.words.length) blocks.push(cur);
  if (!blocks.length) return [];
  // dedupe across blocks
  const seen = {};
  blocks.forEach(b => b.words = b.words.filter(w => (seen[w] ? false : (seen[w]=1, true))));
  return blocks.filter(b => b.words.length);
}

/* Gumroad keys look like ABCD1234-ABCD1234-ABCD1234-ABCD1234. We also still
   accept the older UUID shape so nobody who bought early is stranded. */
function looksLikeKey(s){
  const v = String(s||'').trim();
  return /^[0-9A-Za-z]{8}-[0-9A-Za-z]{8}-[0-9A-Za-z]{8}-[0-9A-Za-z]{8}$/.test(v)
      || /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
}

/* The only things that mean "this purchase is genuinely over".

   Only three things end access: refunded, disputed/charged back, or the
   subscription genuinely ended. Note the two that are deliberately NOT here,
   because getting either wrong quietly locks out a family who has paid:

     subscription_cancelled_at — cancelling means "don't bill me again". They
       have still paid to the end of the period and the terms page promises them
       that time.
     subscription_failed_at — that is a card being retried. Locking someone out
       mid-retry is the exact moment they would otherwise have gone and fixed it.

   This matches One Ayah At A Time, so all three apps behave the same way. */
function purchaseIsOver(p){
  if (!p) return false;
  return !!(p.refunded || p.chargebacked || p.disputed || p.subscription_ended_at);
}

/* Ask Gumroad about a key, trying each product we sell until one recognises it.
   increment_uses_count is deliberately false: a family uses as many devices as
   it likes, and we never want a child locked out for opening the app twice.
   Returns { ok, reason, sku, purchase } and never throws. */
function verifyKey(key){
  const k = String(key||'').trim();
  const skus = GUMROAD_SKUS.filter(s => s.id);
  if (!k) return Promise.resolve({ ok:false, reason:'empty' });
  if (!skus.length) return Promise.resolve({ ok:false, reason:'unconfigured' });

  let reachedGumroad = false;
  const askOne = (i) => {
    if (i >= skus.length){
      return { ok:false, reason: reachedGumroad ? 'notfound' : 'offline' };
    }
    const sku = skus[i];
    return fetch(GUMROAD_VERIFY, { method:'POST', body:new URLSearchParams({
        product_id: sku.id, license_key: k, increment_uses_count:'false' }) })
      .then(r => r.json().catch(()=>null))
      .then(j => {
        reachedGumroad = true;
        if (!j || !j.success) return askOne(i+1);      // wrong product, keep looking
        const p = j.purchase || {};
        if (purchaseIsOver(p)) return { ok:false, reason:'ended', sku:sku.label };
        if (sku.variantContains &&
            String(p.variants||'').toLowerCase().indexOf(sku.variantContains) < 0){
          return { ok:false, reason:'other-app', sku:sku.label };
        }
        return { ok:true, sku:sku.label, purchase:p };
      })
      .catch(() => askOne(i+1));                       // offline: try the next
  };
  return Promise.resolve(askOne(0));
}

/* What to write in the app when a key doesn't work. Never blame the parent. */
function keyProblem(reason){
  if (reason === 'ended')     return 'That key has ended \u2014 write to us and we\'ll sort it';
  if (reason === 'other-app') return 'That key is for one of our other apps';
  return 'That key didn\'t work \u2014 check the email it came in';
}

/* Quiet background re-check. Only ever revokes on a definite "this is over"
   from Gumroad, or after three weeks of a key Gumroad no longer recognises. */
function recheckLicence(){
  if (!DB.licence || !DB.licence.key) return;
  const last = DB.licence.checked || 0;
  if (Date.now() - last < RECHECK_DAYS * 86400000) return;

  verifyKey(DB.licence.key).then(res => {
    if (res.ok){
      DB.licence.checked = Date.now();
      DB.licence.sku = res.sku;
      DB.licence.dead = false;
      DB.licence.pending = false;
      DB.licence.failingSince = 0;
      save(); return;
    }
    if (res.reason === 'ended'){          // Gumroad says it is genuinely finished
      DB.licence.dead = true;
      DB.licence.checked = Date.now();
      save(); return;
    }
    if (res.reason === 'notfound'){       // we reached Gumroad and it didn't know the key
      DB.licence.failingSince = DB.licence.failingSince || Date.now();
      if (Date.now() - DB.licence.failingSince > GRACE_DAYS * 86400000){
        DB.licence.dead = true;
      }
      save(); return;
    }
    // offline, or no product ids filled in yet: change nothing at all
  }).catch(()=>{});
}
function trialLeft(){
  if (!DB || !DB.trialStart) return null;
  const used = Math.floor((Date.now() - DB.trialStart) / 86400000);
  return Math.max(0, TRIAL_DAYS - used);
}
function hasAccess(){
  if (DB && DB.licence && DB.licence.key && !DB.licence.dead) return true;
  if (DB && DB.accessCode && codeOk(DB.accessCode)) return true;
  const left = trialLeft();
  return left !== null && left > 0;
}

/* ---------------- keeping the family's devices in step ----------------
   A child does Monday on the iPad downstairs, then Tuesday on a phone upstairs,
   and a parent checks from a third device while out. That only works if progress
   travels between devices, so it does.

   It travels under a FINGERPRINT of the family code — yes, literally a
   fingerprint: a one-way scramble. The same code always produces the same
   64-character string, and there is no way back from that string to the code.
   It's the only thing the server ever sees, so the database cannot say who
   anybody is. No email, no real name, no birthday, no school.

   During the free trial there is no code, so there's no fingerprint and nothing
   is stored anywhere at all. */
const SB_URL = 'https://nkkckcnclqwpvvwujedg.supabase.co';
const SB_KEY = 'sb_publishable_jTvqG53LAS1LsP7A8evx2Q_RgekRHXZ';
const FAMILY_SALT = 'SpellingQuest/family/';
let SYNC = { state:'idle', last:0, timer:null, busy:false, err:'' };

function familyFingerprint(){
  if (!DB) return null;
  if (DB.licence && DB.licence.key) return sha256(FAMILY_SALT + normCode(DB.licence.key));
  if (DB.accessCode) return sha256(FAMILY_SALT + DB.accessCode);
  return null;                       // free trial — nothing to sync to
}

function sbRpc(fn, body){
  return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{ apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  }).then(r => { if (!r.ok) throw new Error('sync ' + r.status); return r.json(); });
}

/* The same rule the database uses: progress only ever moves forwards. A device
   that has been offline can add what it did, but can never undo what another
   device already finished. */
function forwardMerge(a, b){
  if (a === null || a === undefined) return b;
  if (b === null || b === undefined) return a;
  const objA = typeof a === 'object' && !Array.isArray(a);
  const objB = typeof b === 'object' && !Array.isArray(b);
  if (objA && objB){
    const out = Object.assign({}, a);
    Object.keys(b).forEach(k => { out[k] = forwardMerge(a[k], b[k]); });
    return out;
  }
  if (typeof a === 'number'  && typeof b === 'number')  return Math.max(a, b);
  if (typeof a === 'boolean' && typeof b === 'boolean') return a || b;
  return b;
}

/* "Has anyone actually used this child?" — one definition, used both for deciding
   what to send and what to tidy away.

   The old test treated ANY progress object as use. But merely opening a
   placeholder child builds the week for them, which created an empty progress
   object — so tapping "Player 1" once promoted it to a real child that then
   synced to every device in the family and could never be tidied up. A child
   counts as used only if they have stars, a streak, a badge, a name a grown-up
   chose, or a day they actually finished. */
function kidHasBeenUsed(k){
  if (!k) return false;
  if ((k.xp || 0) > 0 || (k.streak || 0) > 0 || (k.badges || []).length) return true;
  if (!/^(Player|Kid) \d+$/.test(k.name || '')) return true;
  const prog = k.prog || {};
  return Object.keys(prog).some(w => {
    const days = (prog[w] && prog[w].days) || {};
    return Object.keys(days).some(d => days[d] && days[d].done);
  });
}

function syncPayload(fp, k){
  return { p_family_hash: fp, p_kid_id: k.id, p_nickname: k.name || '',
    p_avatar: k.avatar || '', p_removed: !!k.removed,
    p_grade:    (typeof k.grade   === 'number') ? k.grade   : null,
    p_test_day: (typeof k.testDay === 'number') ? k.testDay : null,
    p_xp: k.xp || 0, p_streak: k.streak || 0,
    p_badges: k.badges || [], p_progress: k.prog || {}, p_missed: [],
    p_week_words: (DB.weekRawByKid && DB.weekRawByKid[k.id]) || '' };
}

/* Fold what the other devices know back into this one. */
function absorb(rows){
  let changed = false;
  (rows || []).forEach(r => {
    if (r.removed){                       // removed on another device — take them off this one
      const i = DB.kids.findIndex(x => x.id === r.kid_id);
      if (i >= 0){
        if (DB.active === DB.kids[i].id) DB.active = null;
        if (DB.weekRawByKid) delete DB.weekRawByKid[r.kid_id];
        DB.kids.splice(i, 1); changed = true;
      }
      return;
    }
    let k = DB.kids.find(x => x.id === r.kid_id);
    if (!k){
      // a child set up on another device — bring them across
      k = blankKid(r.nickname || 'Player',
                   r.avatar || AVATARS[DB.kids.length % AVATARS.length],
                   (typeof r.grade === 'number') ? r.grade : 1);
      k.id = r.kid_id;
      DB.kids.push(k);
      changed = true;
    }
    const xp = Math.max(k.xp || 0, r.xp || 0);
    const st = Math.max(k.streak || 0, r.streak || 0);
    if (xp !== (k.xp||0) || st !== (k.streak||0)) changed = true;
    k.xp = xp; k.streak = st;

    if (!k.name && r.nickname){ k.name = r.nickname; changed = true; }
    if (r.avatar && k.avatar !== r.avatar){ k.avatar = r.avatar; changed = true; }
    if (typeof k.grade   !== 'number' && typeof r.grade    === 'number'){ k.grade   = r.grade;    changed = true; }
    if (typeof k.testDay !== 'number' && typeof r.test_day === 'number'){ k.testDay = r.test_day; changed = true; }

    const badges = Array.from(new Set([].concat(k.badges || [], r.badges || [])));
    if (badges.length !== (k.badges || []).length) changed = true;
    k.badges = badges;

    const prog = forwardMerge(k.prog || {}, r.progress || {});
    if (JSON.stringify(prog) !== JSON.stringify(k.prog || {})) changed = true;
    k.prog = prog;

    // only take the word list if this device hasn't got a real one of its own,
    // so a parent typing this week's list can't be overwritten mid-sentence
    DB.weekRawByKid = DB.weekRawByKid || {};
    const mine = (DB.weekRawByKid[k.id] || '').trim();
    if (r.week_words && (!mine || mine === SAMPLE.trim())){
      DB.weekRawByKid[k.id] = r.week_words; changed = true;
    }
  });

  /* A new device starts life with two placeholder children ("Player 1",
     "Player 2"). Once the real family arrives from another device, those
     placeholders are just clutter — a parent entering the code on their phone
     should see their own children, not four names. Only ever drop a placeholder
     that has never been used. */
  const remoteIds = (rows || []).map(r => r.kid_id);
  if (remoteIds.length){
    const untouched = k => !kidHasBeenUsed(k) && remoteIds.indexOf(k.id) < 0;
    const keep = DB.kids.filter(k => !untouched(k));
    if (keep.length && keep.length !== DB.kids.length){
      DB.kids.forEach(k => { if (untouched(k) && DB.weekRawByKid) delete DB.weekRawByKid[k.id]; });
      if (DB.active && !keep.some(k => k.id === DB.active)) DB.active = null;
      DB.kids = keep;
      changed = true;
    }
  }
  return changed;
}

function paintSync(){
  const el = document.getElementById('syncline');
  if (!el) return;
  const map = { idle:'', working:'Syncing…', ok:'✅ Up to date on all your devices',
                offline:'📴 No connection — it will catch up later',
                later:'⏳ Couldn\'t reach the sync just now — it will retry' };
  el.textContent = map[SYNC.state] || '';
}

function syncNow(opts){
  opts = opts || {};
  const fp = familyFingerprint();
  if (!fp) return Promise.resolve(false);
  if (SYNC.busy) return Promise.resolve(false);
  if (typeof navigator !== 'undefined' && navigator.onLine === false){
    SYNC.state = 'offline'; paintSync(); return Promise.resolve(false);
  }
  SYNC.busy = true; SYNC.state = 'working'; SYNC.err = ''; paintSync();
  return sbRpc('pull_progress', { p_family_hash: fp })
    .then(rows => {
      const changed = absorb(rows);
      /* Don't send placeholder children. An untouched "Player 2" that nobody has
         used would otherwise land on every other device in the family, where it
         can't be recognised as a placeholder any more. */
      const worthSending = DB.kids.filter(k => k.removed || kidHasBeenUsed(k));
      return Promise.all(worthSending.map(k => sbRpc('push_progress', syncPayload(fp, k))))
             .then(() => changed);
    })
    .then(changed => {
      SYNC.busy = false; SYNC.state = 'ok'; SYNC.last = Date.now();
      // write straight to storage rather than save(), or we'd trigger another sync
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){}
      paintSync();
      if (changed && opts.repaint !== false) render();
      return changed;
    })
    .catch(e => {
      SYNC.busy = false; SYNC.state = 'later'; SYNC.err = String((e && e.message) || e);
      paintSync();
      return false;                       // never let a sync problem break a lesson
    });
}

/* Every save nudges a sync, debounced so a child racing through a quiz doesn't
   fire twenty of them. */
function scheduleSync(){
  if (!familyFingerprint()) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => syncNow({ repaint:false }), 2500);
}

function startSync(){
  if (!familyFingerprint()) return;
  syncNow();
  // coming back to the app is exactly when another device's work should appear
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });
  window.addEventListener('online', () => syncNow());
}

/* ---------------- the week, anchored to each child's test day ----------------
   The seven activities are slots, not fixed weekdays. Slot 1 is the day of the
   test itself — the day the teacher hands out the new list — and slot 7 is the
   day before the next test. A child tested on Friday gets Friday as Day 1; a
   child tested on Monday gets Monday, which is how the app has always behaved.
   Test day is stored per child, so two children in the same house can be on
   different schedules. */
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WEEKDAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function testDayOf(k){
  const t = k && k.testDay;
  return (typeof t === 'number' && t >= 0 && t <= 6) ? t : 1;   // Monday by default
}
/* which real weekday does slot i fall on, for this child */
function weekdayForSlot(i, k){ return (testDayOf(k) + i) % 7; }
function slotName(i, k){ return WEEKDAYS[weekdayForSlot(i, k)]; }
function slotShort(i, k){ return WEEKDAYS_SHORT[weekdayForSlot(i, k)]; }
/* the label a child sees on a day card */
function dayLabel(d, k){ return slotName(DAY_INDEX[d.key], k || kid()); }

function todayKey(){
  const js = new Date().getDay();                      // 0=Sun
  const off = (js - testDayOf(kid()) + 7) % 7;         // how far into their week
  return DAYS[off].key;
}
function dayUnlocked(){ return true; }   // every day is always open

function completeDay(key, stars, xp){
  const p = prog();
  const prev = p.days[key] || {};
  p.days[key] = { done:true, stars:Math.max(stars||0, prev.stars||0), when:new Date().toISOString().slice(0,10) };
  const k = kid();
  k.xp = (k.xp||0) + (xp||0);
  // streak
  const today = new Date().toISOString().slice(0,10);
  if (k.lastDay !== today){
    const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
    k.streak = (k.lastDay === y) ? (k.streak||0)+1 : 1;
    k.lastDay = today;
  }
  award('first');
  if (k.streak >= 3) award('streak3');
  if (k.streak >= 7) award('streak7');
  if (level(k) >= 5) award('level5');
  if (level(k) >= 10) award('level10');
  if (DAYS.every(d => p.days[d.key] && p.days[d.key].done)){
    award('week');
    if (!p.weekCounted){ p.weekCounted = true; k.weeksDone = (k.weeksDone||0)+1;
      if (k.weeksDone >= 4) award('weeks4'); }
  }
  save();
}

/* ---------------- sound effects ---------------- */
let AC = null;
function actx(){
  if (!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if (AC && AC.state === 'suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function blip(freq, start, dur, type, vol, slideTo){
  const c = actx(); if (!c) return;
  const t0 = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol == null ? .22 : vol, t0 + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + .03);
}
function hiss(start, dur, vol){
  const c = actx(); if (!c) return;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = c.createBufferSource(); src.buffer = buf;
  const g = c.createGain(); g.gain.value = vol == null ? .12 : vol;
  src.connect(g); g.connect(c.destination);
  src.start(c.currentTime + start);
}

  clap:   () => { for(let i=0;i<14;i++) hiss(i*.045 + Math.random()*.03, .09, .07);
                  [523,659,784].forEach((f,i)=>blip(f, .12+i*.07, .3, 'triangle', .14)); },
  buzz:   () => { blip(150, 0, .45, 'sawtooth', .16); blip(151.5, 0, .45, 'square', .10); },
  ding:   () => { [1319,1568].forEach((f,i)=>blip(f, i*.09, .5, 'sine', .17)); },
};
function sfx(n, arg){ try{ const f = SFX[n]; if (f) f(arg); }catch(e){} }

/* ---------------- speech ---------------- */
let VOICE = null, voiceReady = false, ALL_VOICES = [], RESCAN_VOICES = null;

/* Only two choices are offered. Daniel (en-GB) is the male default; the female
   list is ordered to match his pronunciation as closely as possible — en-GB
   first, then other British-sounding voices, then anything English. */
const VOICE_SETS = {
  male:   ['Evan','Jamie','Daniel','Oliver','Arthur','Ryan','Google UK English Male',
           'Microsoft Ryan','Alex','Aaron','Tom','Fred','Google US English','Microsoft Guy'],
  female: ['Zoe','Matilda','Serena','Kate','Martha','Stephanie','Google UK English Female',
           'Microsoft Sonia','Moira','Fiona','Karen','Samantha','Ava','Allison','Microsoft Aria']
};
/* The four worth downloading, in the order they'll be picked up automatically. */
const BEST_VOICES = 'Evan or Jamie for a male voice, Zoe or Matilda for a female one';

/* turn our little HTML rule strings into something a voice reads naturally */
/* find the best available voice for the chosen sex */
/* iOS ships a compact and an enhanced version of the SAME voice under the SAME
   display name — "Evan" appears twice once you download the good one. The only
   thing that tells them apart is the identifier:
     com.apple.ttsbundle.Evan-compact   vs   com.apple.voice.enhanced.en-GB.Evan
   So anything judging voice quality has to read the identifier, not the name,
   or a parent downloads a 400 MB voice and hears no difference whatsoever. */
function voiceId(v){ return ((v && (v.voiceURI || v.name)) || '').toLowerCase(); }
function voiceTag(v){
  const id = voiceId(v) + ' ' + ((v && v.name) || '').toLowerCase();
  if (/premium/.test(id))                 return 'Premium';
  if (/enhanced/.test(id))                return 'Enhanced';
  if (/siri/.test(id))                    return 'Siri';
  if (/neural|natural|wavenet/.test(id))  return 'Neural';
  if (/compact/.test(id))                 return 'Basic';
  return '';
}
function voiceLabel(v){
  if (!v) return '';
  const t = voiceTag(v);
  // some devices already put "(Enhanced)" in the name — don't say it twice
  if (!t || new RegExp(t, 'i').test(v.name)) return v.name;
  return v.name + ' · ' + t;
}
function pickVoiceFor(sex){
  const ov = (DB && DB.voicePick && DB.voicePick[sex]);
  if (ov){
    // saves made before this stored the name; both are accepted
    const hit = ALL_VOICES.find(v => v.voiceURI === ov) || ALL_VOICES.find(v => v.name === ov);
    if (hit) return hit;
  }
  const want = VOICE_SETS[sex] || VOICE_SETS.male;
  for (const name of want){
    const hit = ALL_VOICES.find(v => v.name.toLowerCase().indexOf(name.toLowerCase()) >= 0);
    if (hit) return hit;
  }
  // nothing matched by name — prefer a British voice, else the best-scoring one
  return ALL_VOICES.find(v => /en-GB/i.test(v.lang)) || ALL_VOICES[0] || null;
}
function setVoiceSex(sex){
  DB.voiceSex = sex;
  VOICE = pickVoiceFor(sex);
  save();
}

function speakable(html){
  return String(html)
    .replace(/<[^>]+>/g, '')
    .replace(/\s*→\s*/g, ' becomes ')
    .replace(/\s*\+\s*/g, ' plus ')
    .replace(/\s*=\s*/g, ' makes ')
    .replace(/[—–]/g, ', ')
    .replace(/\s*·\s*/g, '. ')
    .replace(/\u2019/g, "'")
    .replace(/\u201c|\u201d/g, '')
    .replace(/\s*\/\s*/g, ' ')
    .replace(/\s+/g, ' ')
    .replace(/\s+([,.!?])/g, '$1')
    .replace(/,\s*,/g, ',')
    .replace(/\s*\.\s*\./g, '.')
    .replace(/([!?])\./g, '$1')                       // no "!." after a title
    .replace(/\b([a-z])(?:-([a-z]))+\b/gi, m => m.split('-').join(', '))  // s-a-i-d -> s, a, i, d
    .replace(/([a-z0-9)!?])\s*$/i, m => /[.!?]$/.test(m) ? m : m + '.')
    .trim();
}
function speed(){ return (DB && DB.rate) ? DB.rate : .85; }
function initVoices(){
  if (!('speechSynthesis' in window)) return;
  const pick = () => {
    const vs = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    if (!vs.length) return;
    // score voices so we land on the most human-sounding one available
    const score = v => {
      const nm  = (v.name || '').toLowerCase();
      // quality words live in the identifier on iOS, in the name elsewhere
      const all = nm + ' ' + voiceId(v);
      let s = 0;
      if (/premium/.test(all)) s += 90;                                 // the best Apple ships
      if (/enhanced|neural|natural|wavenet/.test(all)) s += 60;         // the good downloads
      if (/siri/.test(all)) s += 45;
      if (/compact/.test(all)) s -= 80;                                 // the tinny built-in
      if (/samantha|ava|allison|susan|nicky|zoe|joelle|noelle|evan|tom/.test(nm)) s += 25;
      if (/google/.test(nm)) s += 22;
      if (/karen|moira|tessa|daniel|serena|fiona/.test(nm)) s += 12;    // fine, but not US
      if (/en-us/i.test(v.lang)) s += 14;
      if (/en-gb/i.test(v.lang)) s += 4;
      if (v.localService) s += 4;
      // the old novelty / robotic voices — judged on the name only, so a stray
      // word inside an identifier can't knock out a good voice
      if (/eloquence|fred|albert|zarvox|whisper|bells|boing|bad news|good news|junior|organ|trinoids|bubbles|cellos|deranged|hysterical|pipe|princess|ralph|bahh|wobble|superstar|jester|rocko|shelley|sandy|grandma|grandpa|eddy|flo|reed|rishi/.test(nm)) s -= 80;
      return s;
    };
    const before = VOICE && VOICE.voiceURI;
    ALL_VOICES = vs.slice().sort((a,b) => score(b) - score(a));
    VOICE = pickVoiceFor((DB && DB.voiceSex) || 'male');
    voiceReady = true;
    return !!VOICE && VOICE.voiceURI !== before;
  };
  RESCAN_VOICES = pick;
  pick();
  speechSynthesis.onvoiceschanged = pick;
  /* A voice downloaded in Settings won't appear until the app looks again, and
     an installed web app is usually still running in the background while that
     happens. Look again every time it comes back to the foreground. */
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pick(); });
  window.addEventListener('focus', pick);
}
function say(text, opts){
  opts = opts || {};
  if (!('speechSynthesis' in window)) { if (opts.onend) opts.onend(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(String(text));
  u.rate = (opts.rate != null ? opts.rate : .88) * speed();
  u.pitch = opts.pitch != null ? opts.pitch : 1.0;
  u.lang = 'en-US';
  if (VOICE) u.voice = VOICE;
  if (opts.onend) u.onend = opts.onend;
  try{ speechSynthesis.speak(u); }catch(e){ if(opts.onend) opts.onend(); }
  return u;
}
let SAY_TIMERS = [];
function stopSpeech(){
  SAY_TIMERS.forEach(clearTimeout); SAY_TIMERS = [];
  try{ speechSynthesis.cancel(); }catch(e){}
}
function sayWord(w, opts){ stopSpeech(); return say(w, opts); }
/* sentences sound robotic when they're dragged out — read prose at normal speed */
function sayRule(html, opts){
  stopSpeech();
  return say(speakable(html), Object.assign({ rate:1.02, pitch:1.0 }, opts || {}));
}

/* iOS quietly ignores small rate changes, so "slowly" also breaks the word into
   its chunks with real pauses — which is more useful anyway. */
function saySlow(word){
  stopSpeech();
  const parts = speechSyllables(word);          // real syllables, never letters
  let t = 0;
  if (parts.length > 1){
    parts.forEach(p => {
      SAY_TIMERS.push(setTimeout(() => say(p, { rate:.62 }), t));
      t += 780 + p.length * 130;
    });
    SAY_TIMERS.push(setTimeout(() => say(word, { rate:.62 }), t + 300));
  } else {
    // one-beat word: stretch it out rather than chopping it up
    SAY_TIMERS.push(setTimeout(() => say(word, { rate:.4 }), 0));
    SAY_TIMERS.push(setTimeout(() => say(word, { rate:.55 }), 1500));
  }
}
function sayLetters(w){
  stopSpeech();
  let t = 0;
  w.split('').forEach(c => {
    SAY_TIMERS.push(setTimeout(() => say(c === 'a' ? 'ay' : c, { rate:.6 }), t));
    t += 620;
  });
  SAY_TIMERS.push(setTimeout(() => say(w, { rate:.6 }), t + 300));
}

  };
  const fail = msg => {
    sfx('wrong');
    const f = c.querySelector('#ac');
    f.value = ''; f.placeholder = msg || 'Not quite — check the email';
    btn.disabled = false; btn.textContent = 'Unlock';
  };
  const btn = c.querySelector('#acgo');
  const tryIt = () => {
    const v = (c.querySelector('#ac').value || '').trim();
    if (!v) return;
    if (codeOk(v)){                                   // a code you handed out yourself
      // store the fingerprint, never the code — so the code isn't sitting in
      // localStorage on a child's iPad either
      DB.accessCode = codeFingerprint(v); save(); return unlocked();
    }
    if (!looksLikeKey(v)) return fail('That doesn\'t look right — check the email');
    btn.disabled = true; btn.textContent = 'Checking…';
    verifyKey(v).then(res => {
      if (res.ok){
        DB.licence = { key:v, sku:res.sku, checked:Date.now(), dead:false,
                       pending:false, failingSince:0 };
        save(); return unlocked();
      }
      if (res.reason === 'offline' || res.reason === 'unconfigured'){
        // no internet, or nothing configured yet — let them in and check later
        DB.licence = { key:v, sku:null, checked:0, dead:false, pending:true, failingSince:0 };
        save(); return unlocked();
      }
      fail(keyProblem(res.reason));
    }).catch(() => {
      DB.licence = { key:v, sku:null, checked:0, dead:false, pending:true, failingSince:0 };
      save(); unlocked();
    });
  };
  c.querySelector('#acgo').onclick = tryIt;
  c.querySelector('#ac').addEventListener('keydown', e => { if (e.key === 'Enter') tryIt(); });
  const t = c.querySelector('#actry');
  if (t) t.onclick = () => {
    if (DB.trialStart) return;                 // one free week per device, ever
    DB.trialStart = Date.now(); save(); sfx('good'); go('pick');
  };
  const bb = c.querySelector('#acbuy');
  if (bb) bb.onclick = buyNow;

  a.appendChild(el('<p class="muted center" style="margin-top:14px;color:rgba(255,255,255,.6)">'+
    'No code yet? Tap <b>Have a free look</b> above — a week free, no card needed.</p>'));
  a.appendChild(siteFooter());
}

/* Before this there was no way back in from a forgotten grown-up code except
   wiping the app and losing everything. Your access key or licence key is proof
   enough that you're the parent — a child won't have it. */
function pinRescue(tab){
  const p = popup(
    '<div class="em">🔑</div><h2>Set a new code</h2>'+
    '<p class="muted">Type your access code or licence key — the one from your purchase '+
      'email — and you can choose a new 4-digit grown-up code.</p>'+
    '<input class="ti" id="prkey" placeholder="Access code or licence key" '+
      'style="text-align:center;margin-top:10px">'+
    '<button class="btn green big" id="prgo" style="margin-top:10px">Continue</button>'+
    '<button class="btn link" style="margin-top:6px" data-close>Cancel</button>');
  const inp = p.querySelector('#prkey');
  p.querySelector('#prgo').onclick = () => {
    const v = (inp.value||'').trim();
    const mine = DB.licence && DB.licence.key &&
                 normCode(v) === normCode(DB.licence.key);
    if (codeOk(v) || mine){
      DB.pin = ''; save(); sfx('good'); p.remove();
      toast('Now choose a new code', 3000);
      return parentPinSetup(tab);
    }

function parentGate(tab){
  if (!DB.pin) return parentPinSetup(tab);
  const pin = String(DB.pin);
  let typed = '';
  const p = popup(
    '<div class="em">🔒</div><h2>Grown-ups only</h2>'+
    '<p class="muted" id="pgm">Enter your code</p>'+
    '<div class="pindots" id="pd"></div>'+
    '<div class="pinpad" id="pp"></div>'+
    '<button class="btn link" id="pgforgot" style="margin-top:4px">Forgotten your code?</button>'+
    '<button class="btn link" style="margin-top:2px" data-close>Cancel</button>');
  const dots = p.querySelector('#pd'), pad = p.querySelector('#pp');
  p.querySelector('#pgforgot').onclick = () => { p.remove(); pinRescue(tab); };
  const draw = () => {
    dots.innerHTML = '';
    for (let i = 0; i < pin.length; i++)
      dots.appendChild(el('<i class="'+(i < typed.length ? 'on' : '')+'"></i>'));
  };
  const press = v => {
    if (v === 'del'){ typed = typed.slice(0,-1); draw(); return; }
    if (typed.length >= pin.length) return;
    typed += v; draw();
    if (typed.length === pin.length){
      setTimeout(() => {
        if (typed === pin){ sfx('good'); p.remove(); go('parent', tab); }
        else { sfx('wrong'); typed = ''; draw();
               p.querySelector('#pgm').textContent = 'Not quite — try again'; }
      }, 180);
    }
  };
  ['1','2','3','4','5','6','7','8','9','','0','del'].forEach(v => {
    if (v === ''){ pad.appendChild(el('<span></span>')); return; }
    const b = el('<button class="pk'+(v==='del'?' del':'')+'">'+(v==='del'?'⌫':v)+'</button>');
    b.onclick = () => { sfx('key'); press(v); };
    pad.appendChild(b);
  });
  draw();
}

/* apply a base64 week payload (from a code or a #w= link). returns true on success */
function applyWeekPayload(code){
  try{
    const d = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (d.v === 2 && d.kids && d.kids.length){
      d.kids.forEach((entry, i) => {
        const match = DB.kids.find(k => k.name.toLowerCase().trim() === String(entry.n||'').toLowerCase().trim())
                   || DB.kids[i];
        if (match) DB.weekRawByKid[match.id] = entry.w;
      });
      DB.weekRaw = d.kids[0].w;
    } else if (d.pk){
      DB.weekRawByKid = d.r;
    } else {
      DB.weekRaw = d.r;
      DB.kids.forEach(k => DB.weekRawByKid[k.id] = d.r);
    }
    DB.weekId = d.id || ('w'+Date.now());
    logWeek(); save();
    return true;
  }catch(e){ return false; }
}

function newWeekId(){
  DB.weekId = 'w' + new Date().toISOString().slice(0,10) + '-' + Math.random().toString(36).slice(2,5);
  logWeek();
}
function logWeek(){
  DB.weekLog = DB.weekLog || {};
  DB.weekLog[DB.weekId] = { date: new Date().toISOString().slice(0,10) };
}

    '<table class="pt">'+ days.map(d => {
      const e = wl[d.key];

        return '<div style="display:flex;justify-content:space-between;gap:10px;padding:2px 0">'+

/* how the spelling-bee list is going */
function beeLogHtml(k){
  const raw = (DB.beeByKid && DB.beeByKid[k.id]) || '';
  if (!String(raw).trim()) return '';
  let words = [];
  try{ const wk = buildWeek(raw, {}); wk.sections.forEach(s2 => s2.words.forEach(w => words.push(w.word))); }
  catch(e){ return ''; }
  const bkey = (DB.beeId||'bee1') + ':' + (((DB.beeTargetByKid&&DB.beeTargetByKid[k.id])||DB.beeTarget||'') || 'open');
  const bp = (k.bee && (k.bee[bkey] || k.bee[DB.beeId])) || { stats:{} };
  const st = w => bp.stats[w] || {r:0,x:0,run:0,seen:0};
  const mastered = words.filter(w => st(w).run >= 3);
  const shaky = words.filter(w => st(w).x > 0 && st(w).run < 3);
  const untouched = words.filter(w => !st(w).seen);
  const tgt = (DB.beeTargetByKid && DB.beeTargetByKid[k.id]) || DB.beeTarget || '';
  const days = tgt
    ? Math.max(0, Math.round((new Date(tgt) - new Date(new Date().toISOString().slice(0,10)))/86400000))
    : null;
  return '<h3 style="margin-top:16px;font-size:17px">🐝 Spelling Bee</h3>'+
    '<div class="muted" style="margin-bottom:6px">'+
      (days != null ? days+' day'+(days===1?'':'s')+' to go · ' : '')+
      mastered.length+' of '+words.length+' mastered</div>'+
    '<div class="bar" style="margin-bottom:8px"><i style="width:'+
      Math.round(100*mastered.length/Math.max(1,words.length))+'%"></i></div>'+
    (shaky.length ? '<p class="muted"><b style="color:var(--red)">Needs work:</b> '+shaky.map(esc).join(', ')+'</p>' : '')+
    (untouched.length ? '<p class="muted"><b>Not started yet:</b> '+untouched.length+' word'+(untouched.length===1?'':'s')+'</p>' : '');
}

/* ---------------- boot ---------------- */
function readHashWeek(){
  const m = /[#&]w=([^&]+)/.exec(location.hash);
  if (!m) return false;
  const ok = applyWeekPayload(m[1]);
  if (ok) history.replaceState(null,'',location.pathname);
  return ok;
}

function boot(){
  load();
  initVoices();
  const gotWeek = readHashWeek();
  if (window.WEEK_PRESET && window.WEEK_PRESET.id && window.WEEK_PRESET.id !== DB.presetSeen){
    DB.weekRaw = window.WEEK_PRESET.words;
    DB.weekTitle = window.WEEK_PRESET.title || '';
    DB.weekId = window.WEEK_PRESET.id;
    DB.presetSeen = window.WEEK_PRESET.id;
    logWeek(); save();
  }
  if (!DB.weekLog || !DB.weekLog[DB.weekId]){ logWeek(); save(); }
  const st = document.querySelector('.stars');
  ['⭐','✨','💫','🌟','⭐','✨'].forEach((s,i) => {
    const n = el('<i>'+s+'</i>');
    n.style.left = (8 + i*17) + '%';
    n.style.top = (10 + (i%3)*28) + '%';
    n.style.fontSize = (14 + (i%3)*8) + 'px';
    n.style.animationDelay = (i*.7)+'s';
    st.appendChild(n);
  });
  if (gotWeek) toast('📚 New words loaded!');
  try{ recheckLicence(); }catch(e){}
  DB.active = null;
  go(hasAccess() ? 'pick' : 'gate');
  try{ startSync(); }catch(e){}
}
document.addEventListener('DOMContentLoaded', boot);

let MISSED = [];
function noteMiss(w){ if (MISSED.indexOf(w) < 0) MISSED.push(w); }

function highlight(word, patternId){

  return esc(word.slice(0,m.i)) + '<span class="hi">' + esc(word.slice(m.i, m.i+m.len)) + '</span>' + esc(word.slice(m.i+m.len));
}

let BACK_TO = 'home';
function dayHeader(a, d, sub){

function finishScreen(d, correct, total, extra){

/* ============ reusable typing round ============ */
/* opts: {word, patternId, blanks(null=all), showWord, hintAudio, onDone(ok,tries)} */
function typingRound(host, opts){
  const word = opts.word.toLowerCase();
  const all = opts.blanks == null;
  const blanks = all ? word.split('').map((_,i)=>i) : opts.blanks;
  const filled = {};
  let tries = 0, locked = false;

  const boxes = el('<div class="boxes"></div>');
  host.appendChild(boxes);
  const kb = buildKeyboard(onKey);
  host.appendChild(kb);

  function cursor(){ for (const i of blanks) if (!filled[i]) return i; return -1; }

  function draw(state){
    boxes.innerHTML = '';
    const cur = cursor();
    for (let i=0;i<word.length;i++){
      const isBlank = blanks.indexOf(i) >= 0;
      let cls = 'lbox', ch = word[i];
      if (isBlank){
        cls += ' blank';
        ch = filled[i] || '';
        if (i === cur && !state) cls += ' cur';
        if (state === 'good') cls += ' good';
        if (state === 'bad')  cls += ' bad';
      }
      boxes.appendChild(el('<div class="'+cls+'">'+(ch?esc(ch):'')+'</div>'));
    }
  }

  function onKey(k){
    if (locked) return;
    if (k === 'del'){
      const c = cursor();
      const idx = c === -1 ? blanks[blanks.length-1] : blanks[blanks.indexOf(c)-1];
      if (idx != null) delete filled[idx];
      draw(); return;
    }
    const c = cursor();
    if (c === -1) return;
    filled[c] = k;
    draw();
    if (cursor() === -1) setTimeout(check, 220);
  }

  function check(){
    const ok = blanks.every(i => (filled[i]||'') === word[i]);
    tries++;
    if (ok){
      locked = true; draw('good');
      if (!opts.noStats){ wordStat(word).r++; save(); }
      sfx(tries === 1 ? 'great' : 'good');
      setTimeout(()=>sayWord(word), 260);
      toast('🎉 '+cheer(), 2200);
      setTimeout(()=>opts.onDone(tries === 1, tries), 1500);
    } else {
      draw('bad');
      sfx('wrong');
      if (tries === 1){ if (!opts.noStats) wordStat(word).x++; noteMiss(word); save(); }
      setTimeout(()=>{
        if (tries >= 2){
          locked = true;
          blanks.forEach(i => filled[i] = word[i]);
          draw('good');
          if (opts.noSpell){
            toast('The judges say it\'s <b>'+esc(word)+'</b> — take a good look.', 6000);
            setTimeout(()=>sayWord(word), 300);
          } else {
            toast('Here it is: <b>'+esc(word)+'</b> — spell it out with me!', 6000);
            setTimeout(()=>sayLetters(word), 300);
          }
          setTimeout(()=>opts.onDone(false, tries), 5200);
        } else {
          blanks.forEach(i => { if (filled[i] !== word[i]) delete filled[i]; });
          toast(encourage(), 3200);
          draw();
        }
      }, 700);
    }
  }

  draw();
  return { redraw: draw };
}

function buildKeyboard(onKey){
  const rows = ['qwertyuiop','asdfghjkl','zxcvbnm'];
  const kb = el('<div class="keyboard"></div>');
  rows.forEach((r,ri) => {
    const row = el('<div class="krow"></div>');
    if (ri === 2) { const d = el('<button class="key wide del">⌫ Delete</button>'); d.onclick = ()=>onKey('del'); row.appendChild(d); }
    r.split('').forEach(c => { const b = el('<button class="key">'+c+'</button>'); b.onclick = ()=>{ sfx('key'); onKey(c); }; row.appendChild(b); });
    if (ri === 2) { const s = el('<button class="key wide">\'</button>'); s.onclick = ()=>onKey("'"); row.appendChild(s); }
    kb.appendChild(row);
  });
  return kb;
}

/* ============ misspelling generator (for multiple choice) ============ */
const CONFUSE = { ie:'ei', ei:'ie', igh:'ie', ai:'ay', ay:'ai', ee:'ea', ea:'ee', oa:'ow', ow:'oa',
  oi:'oy', oy:'oi', ou:'ow', au:'aw', aw:'au', ir:'er', er:'ur', ur:'ir', ck:'k', ph:'f',
  tch:'ch', dge:'ge', kn:'n', wr:'r', oo:'u', ue:'oo', ew:'oo', igh2:'ight' };

function misspell(word, patternId){
  const w = word.toLowerCase();
  const out = new Set();
  const p = PATTERN_BY_ID[patternId];
  const m = p ? matchPattern(w, p) : null;
  if (m && CONFUSE[p.g]) out.add(w.slice(0,m.i) + CONFUSE[p.g] + w.slice(m.i+m.len));
  if (m && p.g.length > 1) out.add(w.slice(0,m.i) + p.g.split('').reverse().join('') + w.slice(m.i+m.len));
  // double / undouble a consonant
  const dbl = /([bcdfgklmnprstz])\1/.exec(w);
  if (dbl) out.add(w.replace(dbl[0], dbl[1]));
  else {
    for (let i=1;i<w.length-1;i++){
      if (!isVowel(w[i]) && isVowel(w[i-1])){ out.add(w.slice(0,i)+w[i]+w.slice(i)); break; }
    }
  }
  // drop a silent-ish letter
  if (/e$/.test(w) && w.length > 3) out.add(w.slice(0,-1));
  // swap two middle letters
  if (w.length > 4){ const i = Math.floor(w.length/2); out.add(w.slice(0,i-1)+w[i]+w[i-1]+w.slice(i+1)); }
  return Array.from(out).filter(x => x !== w && x.length > 1);
}

/* ============================================================
   MONDAY — Meet the Words
   ============================================================ */
function actMonday(a, d){
  const words = WEEK.allWords;
  let si = -1, wi = 0, readCount = 0;
  const host = el('<div></div>'); a.appendChild(host);

  // walk sections, showing the tip card before each group
  let queue = [];
  WEEK.sections.forEach(s => { queue.push({tip:s}); s.words.forEach(w => queue.push({word:w, sec:s})); });
  let qi = 0;

  function next(){
    if (qi >= queue.length){
      if (readCount >= words.length) award('reader');
      return finishScreen(d, readCount, words.length);
    }
    const item = queue[qi++];
    host.innerHTML = '';
    if (item.tip) return showTip(item.tip);
    return showWord(item);
  }

  function showTip(s){
    const c = el('<div class="card">'+
      '<div class="center" style="font-size:46px">'+s.emoji+'</div>'+
      '<h2 class="center" style="font-size:24px">'+esc(s.label)+'</h2>'+
      '<div class="tip"><h3>💡 '+s.tip.title+'</h3><p>'+s.tip.rule+'</p>'+
      '<p class="trick">'+s.tip.trick+'</p></div>'+
      '<div class="center"><button class="btn" id="hear">🔊 Hear the trick</button></div>'+
      '<button class="btn big green" style="margin-top:12px" id="ok">Got it! Let\'s read →</button></div>');
    const ruleText = s.tip.title + '. ' + s.tip.rule + ' ' + s.tip.trick;
    c.querySelector('#hear').onclick = () => sayRule(ruleText);
    c.querySelector('#ok').onclick = () => { sfx('tap'); next(); };
    host.appendChild(c);
    setTimeout(()=>sayRule(ruleText), 400);
  }

  function showWord(item){
    const w = item.word;
    const c = el('<div class="card center">'+
      '<div class="muted">'+item.sec.emoji+' '+esc(item.sec.label)+' · word '+(wi+1)+' of '+words.length+'</div>'+
      '<div class="bigword">'+highlight(w.word, item.sec.patternId)+'</div>'+
      '<div class="speaker" id="sp">🔊</div>'+
      '<p class="muted" style="margin-top:14px">Tap to hear it, then <b>read it out loud</b>!</p>'+
      '<div class="mic"><i id="lvl"></i></div>'+
      '<div id="micnote" class="muted" style="font-size:13px">🎤 Listening for your voice…</div>'+
      '<button class="btn big green" id="done" style="margin-top:12px">✅ I read it out loud!</button>'+
      '<div class="row" style="margin-top:8px;justify-content:center">'+
        '<button class="btn grey" id="sl">🐢 Slowly</button>'+
        '<button class="btn grey" id="le">🔡 Letter by letter</button>'+
      '</div></div>');
    host.appendChild(c);
    wi++;
    const sp = c.querySelector('#sp');
    const play = () => { sp.classList.add('playing'); sayWord(w.word, { onend: ()=>sp.classList.remove('playing') }); };
    sp.onclick = play;
    c.querySelector('#sl').onclick = () => saySlow(w.word);
    c.querySelector('#le').onclick = () => sayLetters(w.word);
    setTimeout(play, 300);

    let finished = false;
    const finish = () => { if (finished) return; finished = true; readCount++; stopMic(); sfx('good');

    c.querySelector('#done').onclick = finish;
    startMic(c.querySelector('#lvl'), c.querySelector('#micnote'), finish);
  }

  next();
}

/* mic level meter — no speech recognition, just "did you make noise?" */
let micStream = null, micCtx = null, micRaf = null;
function startMic(bar, note, onSpoke){
  const hide = () => {
    if (note) note.textContent = '';
    const m = bar && bar.parentNode; if (m) m.style.display = 'none';
  };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ hide(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
    micStream = stream;
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(stream);
    const an = micCtx.createAnalyser(); an.fftSize = 512;
    src.connect(an);
    const data = new Uint8Array(an.frequencyBinCount);
    let loudFrames = 0;
    const tick = () => {
      an.getByteFrequencyData(data);
      let sum = 0; for (let i=0;i<data.length;i++) sum += data[i];
      const avg = sum/data.length;
      const pct = Math.min(100, Math.round(avg*2.6));
      if (bar) bar.style.width = pct + '%';
      if (avg > 20){ loudFrames++; if (note) note.textContent = '🗣️ I can hear you — great reading!'; }
      else loudFrames = Math.max(0, loudFrames-1);
      if (loudFrames > 45){ if (onSpoke) onSpoke(); return; }
      micRaf = requestAnimationFrame(tick);
    };
    tick();
  }).catch(hide);
}
function stopMic(){
  if (micRaf) cancelAnimationFrame(micRaf); micRaf = null;
  if (micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
  if (micCtx){ try{micCtx.close();}catch(e){} micCtx = null; }
}

   TUESDAY — Sound & Build (chunk flashcards)

function actTuesday(a, d){
  const host = el('<div></div>'); a.appendChild(host);
  let queue = [];
  WEEK.sections.forEach(s => { queue.push({tip:s}); s.words.forEach(w => queue.push({word:w, sec:s})); });
  let qi = 0, correct = 0, total = WEEK.allWords.length, firstTry = 0;
  const dd = dots(total, a);
  let di = 0;

  function next(){
    if (qi >= queue.length){
      if (correct === total) award('builder');
      return finishScreen(d, firstTry, total);
    }
    const item = queue[qi++];
    host.innerHTML = '';
    if (item.tip){
      const c = el('<div class="card center">'+
        '<div style="font-size:44px">'+item.tip.emoji+'</div>'+
        '<h2 style="font-size:23px">'+esc(item.tip.label)+'</h2>'+
        '<div class="tip"><h3>💡 '+item.tip.tip.title+'</h3>'+
          '<p>'+item.tip.tip.rule+'</p><p class="trick">'+item.tip.tip.trick+'</p></div>'+
        '<button class="btn" id="hear">🔊 Hear the rule</button>'+
        '<button class="btn big blue" id="go" style="margin-top:10px">Start this group →</button></div>');
      const rt = item.tip.tip.title + '. ' + item.tip.tip.rule + ' ' + item.tip.tip.trick;
      c.querySelector('#hear').onclick = () => sayRule(rt);
      c.querySelector('#go').onclick = () => { sfx('tap'); next(); };
      host.appendChild(c);
      setTimeout(()=>sayRule(rt), 400);
      return;
    }
    build(item);
  }

  function build(item){
    const w = item.word;
    const chunks = w.chunks;
    const pool = shuffle(chunks.concat(distractors(w, chunks.length >= 3 ? 2 : 3)));
    const placed = [];
    let tries = 0;

    const c = el('<div class="card center">'+
      '<div class="muted">'+item.sec.emoji+' '+esc(item.sec.label)+'</div>'+
      '<div class="speaker" id="sp" style="margin-top:12px">🔊</div>'+
      '<p class="muted" style="margin-top:10px">Listen, then tap the pieces in order to build the word.</p>'+
      '<div class="slots" id="slots"></div>'+
      '<div class="tray" id="tray"></div>'+
      '<div class="row" style="margin-top:14px;justify-content:center">'+
        '<button class="btn grey" id="sl">🐢 Slowly</button>'+
        '<button class="btn grey" id="undo">↩️ Undo</button>'+
      '</div></div>');
    host.appendChild(c);

    const sp = c.querySelector('#sp');
    const play = () => { sp.classList.add('playing'); sayWord(w.word, {onend:()=>sp.classList.remove('playing')}); };
    sp.onclick = play;
    c.querySelector('#sl').onclick = () => saySlow(w.word);
    setTimeout(play, 300);

    const slots = c.querySelector('#slots'), tray = c.querySelector('#tray');

    function drawSlots(state){
      slots.innerHTML = '';
      for (let i=0;i<chunks.length;i++){
        const v = placed[i];
        slots.appendChild(el('<div class="slot'+(v?' filled':'')+(state?' '+state:'')+'">'+(v?esc(v.txt):'')+'</div>'));
      }
    }
    function drawTray(){
      tray.innerHTML = '';
      pool.forEach((txt, i) => {
        const used = placed.some(p => p && p.i === i);
        const b = el('<button class="chunk'+(used?' used':'')+'">'+esc(txt)+'</button>');
        b.onclick = () => {
          if (placed.length >= chunks.length) return;
          sfx('pop');
          placed.push({i, txt});
          drawSlots(); drawTray();
          if (placed.length === chunks.length) setTimeout(check, 250);
        };
        tray.appendChild(b);
      });
    }
    c.querySelector('#undo').onclick = () => { placed.pop(); drawSlots(); drawTray(); };

    function check(){
      const made = placed.map(p=>p.txt).join('');
      tries++;
      if (made === w.word.toLowerCase()){
        wordStat(w.word).r++; save();
        slots.querySelectorAll('.slot').forEach(s => { s.style.borderColor = 'var(--green)'; s.style.background = '#dcfce7'; });
        correct++; if (tries === 1) firstTry++;
        setDot(dd, di++, true);
        sfx(tries === 1 ? 'great' : 'good');
        setTimeout(()=>sayWord(w.word), 260);
        toast('🎉 '+cheer(), 2200);
        setTimeout(next, 1600);
      } else {
        if (tries === 1){ wordStat(w.word).x++; noteMiss(w.word); save(); }
        sfx('wrong');
        slots.querySelectorAll('.slot').forEach(s => s.classList.add('bad'));
        setTimeout(() => {
          if (tries >= 2){
            placed.length = 0;
            chunks.forEach(ch => { const i = pool.indexOf(ch); placed.push({i, txt:ch}); });
            drawSlots(); drawTray();
            toast('Here it is: <b>'+esc(w.word)+'</b> — look at the pieces!', 5200);
            setTimeout(()=>sayLetters(w.word), 300);
            setDot(dd, di++, false);
            setTimeout(next, 4800);
          } else {
            placed.length = 0; drawSlots(); drawTray(); toast(encourage(), 3200);
          }
        }, 650);
      }
    }
    drawSlots(); drawTray();
  }

  function distractors(w, n){
    const others = [];
    WEEK.allWords.forEach(x => { if (x.word !== w.word) others.push.apply(others, x.chunks); });
    const uniq = Array.from(new Set(others)).filter(c => w.chunks.indexOf(c) < 0);
    const extra = ['ing','ed','sh','ck','th','er','ay','ea'].filter(c => w.chunks.indexOf(c) < 0);
    return shuffle(uniq.concat(extra)).slice(0, n);
  }

  next();
}

/* ============================================================
   FRIDAY — Arcade (3 games)
   ============================================================ */
function actFriday(a, d){
  const host = el('<div></div>'); a.appendChild(host);
  const p = prog(); p.games = p.games || {};

  function menu(){
    host.innerHTML = '';
    const played = Object.keys(p.games).length;
    const c = el('<div class="card center">'+
      '<div style="font-size:44px">🎮</div><h2>Arcade</h2>'+
      '<p class="muted">Play all three to finish Friday! ('+played+'/3)</p></div>');
    host.appendChild(c);
    const games = [
      { id:'pop',  em:'🎈', n:'Balloon Pop',  s:'Pop the correct spelling', cls:'pink',  fn:gamePop },
      { id:'scr',  em:'🔀', n:'Scramble',     s:'Put the letters in order', cls:'blue',  fn:gameScramble },
      { id:'spd',  em:'⚡', n:'Speed Match',  s:'Beat the clock',           cls:'orange',fn:gameSpeed },
    ];
    games.forEach(g => {
      const b = el('<button class="btn big '+g.cls+'" style="margin-bottom:10px;justify-content:flex-start;text-align:left">'+
        '<span style="font-size:30px">'+g.em+'</span><span><b>'+g.n+'</b>'+
        '<div style="font-size:13px;font-weight:600;opacity:.9">'+g.s+(p.games[g.id]?' · ✅ best '+p.games[g.id]:'')+'</div></span></button>');
      b.onclick = () => g.fn(g.id);
      host.appendChild(b);
    });
    if (played >= 3){
      const f = el('<button class="btn big green">🏁 Finish Friday</button>');
      f.onclick = () => { award('arcade'); finishScreen(d, 3, 3); };
      host.appendChild(f);
    }
  }

  function record(id, score){
    p.games[id] = Math.max(p.games[id]||0, score); save();
    confetti(50); sfx('win');
    const pp = popup('<div class="em">🎉</div><h2>Score: '+score+'</h2><p class="muted">Nice playing!</p>'+
      '<button class="btn big green" data-close>Back to Arcade</button>');
    pp.addEventListener('click', e => { if (e.target.dataset.close !== undefined) menu(); });
  }

  /* --- Balloon Pop --- */
  function gamePop(id){
    const words = shuffle(WEEK.allWords);
    let i = 0, score = 0;
    step();
    function step(){
      if (i >= words.length) return record(id, score);
      const w = words[i];
      const wrongs = shuffle(misspell(w.word, w.patternId)).slice(0,2);
      const opts = shuffle([w.word].concat(wrongs.length ? wrongs : [w.word.split('').reverse().join('')]));
      host.innerHTML = '';
      const c = el('<div class="card center">'+
        '<div class="muted">🎈 '+(i+1)+' of '+words.length+' · '+score+' points</div>'+
        '<div class="speaker" id="sp" style="margin-top:12px">🔊</div>'+
        '<p style="font-weight:800;font-size:18px;margin-top:14px">Pop the balloon that\'s spelled right!</p>'+
        '<div id="ops" style="margin-top:8px"></div></div>');
      host.appendChild(c);
      c.querySelector('#sp').onclick = () => sayWord(w.word);
      setTimeout(()=>sayWord(w.word), 300);
      const ops = c.querySelector('#ops');
      opts.forEach(o => {
        const b = el('<button class="btn big '+(o===w.word?'pink':'pink')+'" style="margin-bottom:9px">🎈 '+esc(o)+'</button>');
        b.onclick = () => {
          if (o === w.word){ score += 10; wordStat(w.word).r++; b.className='btn big green'; b.textContent='✅ '+o;
                 sfx('pop'); setTimeout(()=>sfx('great'), 90); setTimeout(()=>sayWord(w.word), 320); }
          else { wordStat(w.word).x++; noteMiss(w.word); sfx('wrong'); b.className='btn big red'; b.textContent='❌ '+o;
                 Array.from(ops.children).forEach(x => { if (x.textContent.indexOf(w.word)>=0) x.className='btn big green'; }); }
          save();
          ops.querySelectorAll('button').forEach(x=>x.disabled=true);
          i++; setTimeout(step, 1900);
        };
        ops.appendChild(b);
      });
    }
  }

  /* --- Scramble --- */
  function gameScramble(id){
    const words = shuffle(WEEK.allWords);
    let i = 0, score = 0;
    step();
    function step(){
      if (i >= words.length) return record(id, score);
      const w = words[i].word;
      let letters = shuffle(w.split(''));
      if (letters.join('') === w) letters = letters.reverse();
      const picked = [];
      host.innerHTML = '';
      const c = el('<div class="card center">'+
        '<div class="muted">🔀 '+(i+1)+' of '+words.length+' · '+score+' points</div>'+
        '<p style="font-weight:800;font-size:18px;margin-top:10px">Tap the letters in the right order</p>'+
        '<div class="row" style="justify-content:center;margin:8px 0"><button class="btn grey" id="h">🔊 Hear it</button>'+
        '<button class="btn grey" id="u">↩️ Undo</button></div>'+
        '<div class="boxes" id="ans"></div><div class="tray" id="tr"></div></div>');
      host.appendChild(c);
      c.querySelector('#h').onclick = () => sayWord(w);
      c.querySelector('#u').onclick = () => { picked.pop(); draw(); };
      setTimeout(()=>sayWord(w), 300);
      const ans = c.querySelector('#ans'), tr = c.querySelector('#tr');
      function draw(state){
        ans.innerHTML = '';
        for (let j=0;j<w.length;j++)
          ans.appendChild(el('<div class="lbox blank'+(state||'')+'">'+(picked[j]?esc(picked[j].c):'')+'</div>'));
        tr.innerHTML = '';
        letters.forEach((c2, li) => {
          const used = picked.some(p2 => p2.li === li);
          const b = el('<button class="chunk'+(used?' used':'')+'">'+esc(c2)+'</button>');
          b.onclick = () => { if (picked.length >= w.length) return; sfx('key'); picked.push({li,c:c2}); draw();
            if (picked.length === w.length) setTimeout(check, 220); };
          tr.appendChild(b);
        });
      }
      function check(){
        const made = picked.map(p2=>p2.c).join('');
        if (made === w){ score += 10; wordStat(w).r++; save(); draw(' good'); sfx('great');
          setTimeout(()=>sayWord(w), 250); toast('🎉 '+cheer(), 2000);
          i++; setTimeout(step, 1600); }
        else { wordStat(w).x++; noteMiss(w); save(); draw(' bad'); sfx('wrong'); toast(encourage(), 3000);
          setTimeout(()=>{ picked.length = 0; draw(); }, 900); }
      }
      draw();
    }
  }

  /* --- Speed Match --- */
  function gameSpeed(id){
    let score = 0, left = 45, timer = null;
    const all = WEEK.allWords;
    host.innerHTML = '';
    const c = el('<div class="card center">'+
      '<div class="muted">⚡ Speed Match</div>'+
      '<div style="font-size:34px;font-weight:900" id="clk">45</div>'+
      '<div class="muted">Score: <b id="sc">0</b></div>'+
      '<div class="speaker" id="sp" style="margin-top:10px">🔊</div>'+
      '<p style="font-weight:800;margin-top:12px">Which word did you hear?</p>'+
      '<div id="ops"></div></div>');
    host.appendChild(c);
    timer = setInterval(() => {
      left--; c.querySelector('#clk').textContent = left;
      if (left > 0 && left <= 5) sfx('tick');
      if (left <= 0){ clearInterval(timer); sfx('win'); record(id, score); }
    }, 1000);

    function step(){
      if (left <= 0) return;
      const w = all[Math.floor(Math.random()*all.length)];
      const others = shuffle(all.filter(x=>x.word!==w.word)).slice(0,3).map(x=>x.word);
      const opts = shuffle([w.word].concat(others));
      c.querySelector('#sp').onclick = () => sayWord(w.word);
      sayWord(w.word);
      const ops = c.querySelector('#ops'); ops.innerHTML = '';
      opts.forEach(o => {
        const b = el('<button class="btn big blue" style="margin-bottom:8px">'+esc(o)+'</button>');
        b.onclick = () => {
          if (o === w.word){ score += 5; wordStat(w.word).r++; sfx('good'); b.className = 'btn big green'; }
          else { score = Math.max(0, score-2); wordStat(w.word).x++; noteMiss(w.word); sfx('wrong'); b.className = 'btn big red'; }
          save();
          c.querySelector('#sc').textContent = score;
          ops.querySelectorAll('button').forEach(x=>x.disabled=true);
          setTimeout(step, 700);
        };
        ops.appendChild(b);
      });
    }
    step();
  }

  menu();
}

    p.addEventListener('click', e => { if (e.target.dataset.close !== undefined) go('home'); });
  }

  intro();
}

    host.appendChild(c);
    const sp = c.querySelector('#sp');
    const play = () => { sp.classList.add('playing'); sayWord(w.word, {onend:()=>sp.classList.remove('playing')}); };
    sp.onclick = play;
    c.querySelector('#sl').onclick = () => saySlow(w.word);
    setTimeout(play, 350);

    typingRound(c, {
      word:w.word, patternId:w.patternId, blanks:null,
      onDone: ok => {
        if (ok){
          right++; fuel++; combo++; best = Math.max(best, combo);
          sfx('combo', combo);
          if (combo === 3) toast('🔥 Three in a row! Double stars!', 2600);
          if (combo === 5) toast('🔥🔥 FIVE in a row — you\'re on fire!', 2600);
        } else { combo = 0; }
        i++; next();
      }
    });
  }

  function launch(){
    host.innerHTML = '';
    const perfect = right === words.length;
    const pct = Math.round(100*right/words.length);
    const c = el('<div class="card center">'+
      '<div class="rocketbox big"><div class="rk" id="rk" style="bottom:2%">🚀</div>'+

        '<div class="rstar s3">💫</div></div>'+

    host.appendChild(c);
    const rk = c.querySelector('#rk'), cd = c.querySelector('#cd');
    const seq = ['3…','2…','1…','LIFT OFF! 🚀'];
    seq.forEach((t, n) => setTimeout(() => {
      cd.textContent = t;

    setTimeout(() => {

      cd.innerHTML = perfect ? '🌕 You made it to the moon!' : '⭐ '+pct+'% of the way there!';
      setTimeout(() => finishScreen(d, right, words.length,
        (perfect ? '· PERFECT! 💯 ' : '') + (best >= 3 ? '· best combo 🔥'+best : '')), 1600);
    }, 3000 + 2200);
  }

  intro();
}
