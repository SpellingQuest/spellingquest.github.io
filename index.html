<style>
/* ===================== SPELLING QUEST ===================== */
:root{
  --bg:#1a1040;
  --bg2:#2d1b69;
  --card:#ffffff;
  --ink:#251a4a;
  --ink-soft:#6b5f92;
  --line:#e8e3f7;
  --brand:#7c3aed;
  --brand2:#a855f7;
  --pink:#ff5fa2;
  --yellow:#ffc93c;
  --green:#22c98b;
  --red:#ff6b6b;
  --blue:#3ba9ff;
  --orange:#ff9445;
  --r:22px;
  --shadow:0 10px 0 rgba(0,0,0,.14);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Baloo 2", "Comic Sans MS", system-ui, -apple-system, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 700px at 15% -10%, #4c1d95 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 0%, #1e40af 0%, transparent 55%),
    linear-gradient(170deg,#221252 0%,#160c33 100%);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  user-select:none;
  -webkit-user-select:none;
}
button{ font-family:inherit; cursor:pointer; border:none; }
input,textarea{ font-family:inherit; }

/* floating stars background */
.stars{ position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5; }
.stars i{ position:absolute; font-style:normal; animation:float 9s ease-in-out infinite; }
@keyframes float{ 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-18px) rotate(12deg)} }

.wrap{ position:relative; z-index:1; max-width:820px; margin:0 auto; padding:14px 14px 60px; }

/* ---------- generic bits ---------- */
.card{
  background:var(--card); border-radius:var(--r); padding:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.28); margin-bottom:14px;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--brand); color:#fff; font-weight:800; font-size:18px;
  padding:16px 22px; border-radius:18px; box-shadow:0 5px 0 rgba(0,0,0,.22);
  transition:transform .08s, box-shadow .08s; min-height:56px;
}
.btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.22); }
.btn.big{ width:100%; font-size:22px; padding:20px; }
.btn.green{ background:var(--green); } .btn.pink{ background:var(--pink); }
.btn.blue{ background:var(--blue); } .btn.yellow{ background:var(--yellow); color:#4a3200; }
.btn.orange{ background:var(--orange); } .btn.red{ background:var(--red); }
.btn.ghost{ background:rgba(255,255,255,.14); color:#fff; box-shadow:none; font-size:15px; padding:11px 16px; min-height:0;}
.btn.grey{ background:#ece8f8; color:var(--ink); }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.center{ text-align:center; }
.hide{ display:none !important; }
h1,h2,h3{ margin:0 0 8px; }
.muted{ color:var(--ink-soft); font-size:14px; }
.white{ color:#fff; } .white .muted{ color:rgba(255,255,255,.75); }

/* ---------- top bar ---------- */
.topbar{ display:flex; align-items:center; gap:10px; margin-bottom:14px; color:#fff; }
.topbar .avatar{ font-size:34px; background:rgba(255,255,255,.15); border-radius:50%; width:54px; height:54px;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.topbar .who{ flex:1; min-width:0; }
.topbar .who b{ font-size:19px; display:block; }
.topbar .who span{ font-size:13px; opacity:.8; }
.pill{ background:rgba(255,255,255,.16); color:#fff; border-radius:999px; padding:8px 13px;
  font-weight:800; font-size:15px; display:inline-flex; align-items:center; gap:5px; }
.iconbtn{ background:rgba(255,255,255,.16); color:#fff; width:44px; height:44px; border-radius:14px; font-size:20px;
  display:flex; align-items:center; justify-content:center; }

/* ---------- xp bar ---------- */
.xpbar{ height:14px; background:rgba(255,255,255,.18); border-radius:99px; overflow:hidden; margin:10px 0 4px; }
.xpbar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--yellow),var(--pink)); border-radius:99px;
  transition:width .6s cubic-bezier(.2,.9,.3,1); }

/* ---------- day map ---------- */
.daygrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
@media(min-width:620px){ .daygrid{ grid-template-columns:repeat(3,1fr);} }
.day{
  position:relative; border-radius:20px; padding:16px 14px; color:#fff; text-align:left;
  box-shadow:0 6px 0 rgba(0,0,0,.2); overflow:hidden; min-height:118px;
  display:flex; flex-direction:column; justify-content:space-between;
  transition:transform .1s;
}
.day:active{ transform:translateY(3px); }
.day .em{ font-size:30px; line-height:1; }
.day b{ font-size:17px; display:block; margin-top:6px; }
.day small{ font-size:12px; opacity:.9; display:block; line-height:1.3; }
.day .tick{ position:absolute; top:9px; right:10px; font-size:19px; }
.day.locked{ filter:grayscale(.75) brightness(.75); }
.day.today{ outline:4px solid var(--yellow); outline-offset:2px; animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%,100%{outline-color:var(--yellow)} 50%{outline-color:#fff} }
.d1{background:linear-gradient(150deg,#ff7eb3,#ff5fa2)}
.d2{background:linear-gradient(150deg,#5ec9ff,#3b82f6)}
.d3{background:linear-gradient(150deg,#ffd166,#ff9445)}
.d4{background:linear-gradient(150deg,#7ee8a4,#16a34a)}
.d5{background:linear-gradient(150deg,#c084fc,#7c3aed)}
.d6{background:linear-gradient(150deg,#67e8f9,#0891b2)}
.d7{background:linear-gradient(150deg,#fda4af,#e11d48)}

/* ---------- word chips ---------- */
.wordchip{
  display:inline-flex; align-items:center; gap:8px; background:#f4f1fe; color:var(--ink);
  border-radius:14px; padding:12px 15px; font-size:19px; font-weight:800; margin:0 8px 8px 0;
  border:2px solid transparent;
}
.wordchip.done{ background:#e2fbf0; border-color:var(--green); }
.wordchip .sp{ font-size:17px; }

/* ---------- big word display ---------- */
.bigword{
  font-size:clamp(38px,11vw,72px); font-weight:900; letter-spacing:2px; text-align:center;
  color:var(--ink); margin:10px 0 6px; line-height:1.1; word-break:break-word;
}
.bigword .hi{ color:var(--brand); }
.speaker{
  width:110px; height:110px; border-radius:50%; background:linear-gradient(150deg,var(--brand2),var(--brand));
  color:#fff; font-size:46px; display:flex; align-items:center; justify-content:center; margin:0 auto;
  box-shadow:0 8px 0 rgba(0,0,0,.2);
}
.speaker:active{ transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.2); }
.speaker.playing{ animation:wiggle .5s ease-in-out infinite; }
@keyframes wiggle{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }

/* ---------- tip card ---------- */
.tip{
  background:linear-gradient(150deg,#fff8e1,#ffeeba); border:3px dashed var(--orange);
  border-radius:20px; padding:16px; margin:12px 0; color:#5c3d00;
}
.tip h3{ font-size:20px; display:flex; align-items:center; gap:8px; }
.tip p{ margin:6px 0; font-size:16px; line-height:1.45; }
.tip .trick{ background:rgba(255,255,255,.75); border-radius:14px; padding:10px 12px; font-size:17px; font-weight:700; }

/* ---------- chunk flashcards ---------- */
.slots{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0; min-height:74px; }
.slot{
  min-width:74px; height:70px; border-radius:16px; border:4px dashed #cfc6ee; background:#faf8ff;
  display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:900; color:var(--ink);
  padding:0 12px;
}
.slot.filled{ border-style:solid; border-color:var(--brand); background:#efe8ff; }
.tray{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
.chunk{
  min-width:74px; height:66px; border-radius:16px; background:linear-gradient(160deg,#fff,#f0ebff);
  border:3px solid var(--brand2); color:var(--ink); font-size:25px; font-weight:900;
  display:flex; align-items:center; justify-content:center; padding:0 14px;
  box-shadow:0 5px 0 rgba(124,58,237,.35);
}
.chunk:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(124,58,237,.35); }
.chunk.used{ opacity:.25; pointer-events:none; }

/* ---------- letter boxes (missing letters / spelling bee) ---------- */
.boxes{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin:18px 0; }
.lbox{
  width:52px; height:64px; border-radius:12px; display:flex; align-items:center; justify-content:center;

}
.lbox.blank{ background:#fff; border-color:var(--brand2); }
.lbox.blank.cur{ border-color:var(--pink); box-shadow:0 0 0 4px rgba(255,95,162,.25); }

.lbox.bad{ background:#fee2e2; border-color:var(--red); color:#b91c1c; animation:shake .35s; }

.keyboard{ display:flex; flex-direction:column; gap:7px; align-items:center; margin-top:10px; }
.keyboard .krow{ display:flex; gap:5px; justify-content:center; width:100%; }
.key{
  flex:1 1 0; max-width:52px; height:54px; border-radius:10px; background:#fff; color:var(--ink);
  font-size:21px; font-weight:800; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 0 rgba(0,0,0,.18);
}
.key:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
.key.wide{ flex:2 1 0; max-width:110px; font-size:16px; background:#ece8f8; }
.key.del{ background:#ffe1e1; }

/* ---------- progress dots ---------- */
.dots{ display:flex; gap:6px; justify-content:center; margin:4px 0 12px; }
.dots i{ width:11px; height:11px; border-radius:50%; background:#ddd6f3; }

/* ---------- feedback overlay ---------- */
.pop{

}
.pop .inner{ background:#fff; border-radius:26px; padding:26px; text-align:center; max-width:420px; width:100%;
  animation:popin .3s cubic-bezier(.2,1.4,.4,1); max-height:88vh; overflow:auto; }
@keyframes popin{ from{transform:scale(.7); opacity:0} to{transform:scale(1); opacity:1} }
.pop .em{ font-size:64px; }
.toast{
  pointer-events:none;
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:70;
  max-width:92vw;
  background:#fff; color:var(--ink); font-weight:800; padding:14px 20px; border-radius:16px;
  box-shadow:0 10px 26px rgba(0,0,0,.3); animation:popin .25s;
}

/* ---------- mic meter ---------- */
.mic{ height:22px; background:#efeafc; border-radius:99px; overflow:hidden; margin:12px 0; }
.mic > i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--green),var(--yellow),var(--pink));
  transition:width .08s; }

/* ---------- confetti ---------- */
.confetti{ position:fixed; inset:0; pointer-events:none; z-index:80; overflow:hidden; }
.confetti i{ position:absolute; width:11px; height:16px; border-radius:3px; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); opacity:.2 } }

/* ---------- parent ---------- */
.tabs{ display:flex; gap:6px; margin-bottom:12px; }
.tabs button{ flex:1; background:rgba(255,255,255,.14); color:#fff; padding:12px; border-radius:14px; font-weight:800; font-size:15px; }
.tabs button.on{ background:#fff; color:var(--ink); }
textarea.ta{ width:100%; min-height:170px; border-radius:14px; border:2px solid var(--line); padding:14px;
  font-size:17px; line-height:1.6; resize:vertical; user-select:text; -webkit-user-select:text; }
input.ti{ width:100%; border-radius:12px; border:2px solid var(--line); padding:13px; font-size:17px;
  user-select:text; -webkit-user-select:text; }
label.fl{ display:block; font-weight:800; font-size:14px; margin:12px 0 5px; color:var(--ink-soft); }
table.pt{ width:100%; border-collapse:collapse; font-size:15px; }
table.pt td,table.pt th{ padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; }
.bar{ height:9px; background:var(--line); border-radius:9px; overflow:hidden; min-width:70px; }

.badgegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:10px; }
.badge{ background:#f6f3ff; border-radius:16px; padding:10px 6px; text-align:center; font-size:12px; font-weight:800; color:var(--ink-soft); }

.badge.got{ background:linear-gradient(150deg,#fff2c9,#ffd76e); color:#6b4b00; }

/* ---------- profile picker ---------- */
.who-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.who-card .em{ font-size:52px; display:block; }
.who-card b{ font-size:19px; }
.av-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
.av{ font-size:28px; padding:8px 0; border-radius:12px; background:#f4f1fe; }
.av.on{ background:var(--brand); }

.scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.nowrap{ white-space:nowrap; }

/* ---------- paper practice (write it 5 times) ---------- */
.writerow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between;
  background:#f7f4ff; border-radius:16px; padding:12px 14px; margin-bottom:10px; }
.writerow .ww{ font-size:24px; font-weight:900; color:var(--ink); }
.writerow .ww .sp{ font-size:17px; }
.tally{ display:flex; gap:4px; }
.tally .tk{ width:42px; height:42px; border-radius:11px; background:#fff; font-size:20px;

.tally .tk.on{ background:linear-gradient(150deg,#fff2c9,#ffd76e); }
.tally .tk:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.12); }

/* ---------- Sunday rocket ---------- */
.rocketbox{ position:relative; height:150px; margin:6px 0 4px;
  background:linear-gradient(180deg,#1b1140,#3b2a7a); border-radius:20px; overflow:hidden; }
.rocketbox.big{ height:260px; }
.rocketbox .rk{ position:absolute; left:50%; transform:translateX(-50%); font-size:44px;

.rocketbox .moon{ position:absolute; top:8px; right:14px; font-size:34px; }

.fuel{ height:16px; background:#ece7fb; border-radius:99px; overflow:hidden; margin:10px 0 3px; }
.fuel > i{ display:block; height:100%; border-radius:99px;

.rocketbox.mini{ height:96px; margin:8px 0 2px; }
.rocketbox.mini .rk{ font-size:32px; }
.rocketbox.mini .moon{ font-size:24px; top:5px; right:10px; }
/* subtle text button for use INSIDE white cards (ghost is for dark backgrounds) */
.btn.link{ background:transparent; color:var(--ink-soft); box-shadow:none; font-size:15px;
  padding:10px 14px; min-height:0; text-decoration:underline; }

/* ---------- PIN pad ---------- */
.pindots{ display:flex; gap:12px; justify-content:center; margin:14px 0 18px; }
.pindots i{ width:16px; height:16px; border-radius:50%; background:#e4defa; }

.pinpad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:280px; margin:0 auto; }
.pinpad .pk{ height:62px; border-radius:16px; background:#f4f1fe; color:var(--ink);

.pinpad .pk:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12); }
.pinpad .pk.del{ background:#ffe1e1; font-size:22px; }
select.ti{ appearance:none; background:#fff; }
input[type=range]{ accent-color:var(--brand); height:34px; }

/* ---------- segmented two/three-way picker ---------- */
.seg{ display:flex; gap:8px; margin-top:8px; }
.seg button{ flex:1; padding:14px 6px; border-radius:14px; background:#f0ecfb; color:var(--ink);

.seg button.on{ background:var(--brand); color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.2); }
.seg button:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.1); }

/* ---------- collapsible sections ---------- */
details > summary{ cursor:pointer; font-weight:800; font-size:16px; color:var(--brand);
  list-style:none; padding:4px 0; }
details > summary::-webkit-details-marker{ display:none; }
details > summary::before{ content:'▸ '; }
details[open] > summary::before{ content:'▾ '; }

/* ---------- voice audition list ---------- */
.vrow{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
.vrow .vplay{ width:46px; height:46px; border-radius:12px; background:#eaf5ff; font-size:18px; flex:0 0 auto; }
.vrow .vname{ flex:1; min-width:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vrow .vpin{ width:44px; height:44px; border-radius:12px; background:#f0ecfb; color:var(--ink);
  font-size:19px; font-weight:900; flex:0 0 auto; }
.vrow .vpin.on{ background:var(--brand); color:#fff; }
.tag{ background:var(--green); color:#fff; font-size:10px; font-weight:900; padding:2px 6px;
  border-radius:6px; letter-spacing:.5px; vertical-align:middle; }
.wordchip.bad{ background:#ffe4e4; border-color:var(--red); }
.wordchip.dim{ opacity:.5; }

/* ---------- the hive: one hexagon per word ---------- */
.hive{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:12px 0 6px; }
.hive .hex{ width:26px; height:29px; background:#e6e1f5; display:block;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); transition:background .3s; }
.hive .hex.warm{ background:#ffe4a3; }
.hive .hex.red{ background:#ffb3b3; }
.hive .hex.gold{ background:linear-gradient(160deg,#ffd76e,#ffb02e); }

/* ---------- the bee stage ---------- */
.stage{ position:relative; border-radius:22px; padding:18px 14px 14px;
  background:radial-gradient(120% 90% at 50% 0%, #4b3a12 0%, #241a3f 60%, #1a1030 100%);
  overflow:hidden; text-align:center; }
.stage .spot{ position:absolute; top:-70px; left:50%; transform:translateX(-50%);
  width:230px; height:230px; border-radius:50%;

.stage .micon{ font-size:52px; line-height:64px; height:64px; position:relative; z-index:1; }
.stage .rnd{ color:#ffd76e; font-weight:900; letter-spacing:1px; font-size:13px; position:relative; z-index:1; }
.stage .rivals{ color:#fff; font-size:15px; font-weight:800; margin-top:4px; position:relative; z-index:1; }
.stage .crowd{ font-size:19px; letter-spacing:-3px; margin-top:8px; position:relative; z-index:1; opacity:.9; }
.stage .out{ opacity:.18; }
.judge{ background:#fffdf5; border:3px solid #ffd76e; border-radius:18px; padding:12px 14px;
  margin:12px 0 4px; font-weight:800; color:#5c3d00; font-size:17px; }
.askbacks{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:10px 0 2px; }
.askbacks button{ background:#fff5d6; color:#5c3d00; border-radius:14px; padding:11px 14px;
  font-weight:800; font-size:15px; box-shadow:0 3px 0 rgba(0,0,0,.13); }
.askbacks button:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.13); }

const PATTERNS = [

/* ---------- helpers ---------- */

function isVowel(c){ return 'aeiou'.indexOf(c) >= 0; }

function hasMagicE(w){
  if (w.length < 4) return false;
  if (w[w.length-1] !== 'e') return false;
  const c = w[w.length-2], v = w[w.length-3];
  if (!isVowel(v)) return false;
  if (isVowel(c) || c === 'e') return false;
  if (/(le|se|ce|ge|ve|ze)$/.test(w) && !isVowel(w[w.length-3])) return false;
  return true;
}

/* Find where a pattern sits inside a word. Returns {i, len} or null. */
function matchPattern(word, p){
  const w = word.toLowerCase();
  if (p.custom === 'magic_e') return hasMagicE(w) ? {i:w.length-3, len:3} : null;
  if (!p.g) return null;
  if (p.start) return w.indexOf(p.g) === 0 ? {i:0, len:p.g.length} : null;
  if (p.end)   return w.endsWith(p.g) && w.length > p.g.length + 1
                  ? {i:w.length-p.g.length, len:p.g.length} : null;
  const i = w.indexOf(p.g);
  return i >= 0 ? {i, len:p.g.length} : null;
}

/* Which pattern best describes this word (used only as a fallback). */
function detectPattern(word){
  for (const p of PATTERNS){
    if (matchPattern(word, p)) return p.id;
  }
  return 'misc';
}

/* ---------- grouping ----------
   Given a list of words, find the pattern(s) that the WEEK is built on:
   a pattern only becomes a section if 2+ words share it (or it's the only
   thing we've got). This stops "the" from creating a "th words" section. */
function groupWords(words){
  const counts = {};
  words.forEach(w => {
    PATTERNS.forEach(p => {
      if (matchPattern(w, p)){
        (counts[p.id] = counts[p.id] || []).push(w);
      }
    });
  });

  const order = PATTERNS.map(p => p.id);
  const claimed = {};
  const sections = [];

  // pass 1: patterns shared by 2+ words, most specific pattern first
  order.forEach(id => {
    const list = (counts[id] || []).filter(w => !claimed[w]);
    if (list.length >= 2){
      list.forEach(w => claimed[w] = id);
      sections.push({ patternId:id, words:list.slice() });
    }
  });

  // pass 2: singles — join a matching section, or start their own
  words.forEach(w => {
    if (claimed[w]) return;
    const pid = detectPattern(w);
    if (pid === 'misc') return;
    const existing = sections.find(s => s.patternId === pid);
    if (existing) existing.words.push(w);
    else sections.push({ patternId:pid, words:[w] });
    claimed[w] = pid;
  });

  // pass 3: words that follow no pattern at all get their OWN rule, one each —
  // never a nameless "extra words" bucket.
  words.forEach(w => {
    if (claimed[w]) return;
    claimed[w] = 'tricky';
    sections.push({ patternId:'tricky:'+w, words:[w] });
  });

  return sections;
}

/* common little words, used to split compounds nicely (something -> some|thing) */
const COMMON = ('a about after all also an and any are as at back be been before big but by call can come could day did do down each even every find first for from get give go good great had has have he her here him his how i if in into is it its just know last like little long look made make man many may me more most much must my never new no not now of off old on one only or other our out over own part people place put right said same say see she should show small so some take tell than that the their them then there these they thing think this those thought three through time to too two under up us use very want was way we well went were what when where which while who why will with word work would year you your'
  + ' thing think one time body where way self ever some any every no where how ball fall foot ball house hold play ground birth day sun light moon rain bow snow man mail box tooth brush class room bed room some what up on in to out side in side after noon week end her self him self my self note book back pack pop corn butter fly straw berry rail road side walk basket ball foot ball base ball fire man police man').split(/\s+/);
const COMMON_SET = {}; COMMON.forEach(w => { if (w.length >= 2) COMMON_SET[w] = 1; });

const DIGRAPHS = ['igh','tch','dge','sch','shr','thr','ch','sh','th','ph','wh','ck','ng','qu','gh','wr','kn'];
/* would a split between i-1 and i cut a digraph in half? */
function cutsDigraph(w, i){
  for (const d of DIGRAPHS){
    for (let s = Math.max(0, i - d.length + 1); s <= i - 1; s++){
      if (w.substr(s, d.length) === d && s < i && s + d.length > i) return true;
    }
  }
  return false;
}

/* compound word split: something -> some | thing */
function compoundSplit(w){
  if (w.length < 6) return null;
  for (let i = 3; i <= w.length - 3; i++){
    const a = w.slice(0,i), b = w.slice(i);
    if (COMMON_SET[a] && COMMON_SET[b]) return [a,b];
  }
  return null;
}

/* how many beats does this word have? (vowel groups, minus a silent e) */
function beats(w){
  const m = String(w).toLowerCase().match(/[aeiouy]+/g) || [];
  let n = m.length;
  if (/[^aeiou]e$/.test(w) && n > 1) n--;
  return Math.max(1, n);
}

/* Real syllables, for READING ALOUD. One-beat words are never broken up —
   splitting "light" into l·igh·t sounds like letters, not speech. */
function speechSyllables(w){
  w = String(w).toLowerCase();
  if (beats(w) < 2) return [w];
  const comp = compoundSplit(w);
  if (comp) return comp;
  let parts = syllableSplitCore(w);
  // a fragment with no vowel, or a tiny tail like "re"/"se", sounds wrong on its own
  const merged = [];
  parts.forEach(p => {
    if (merged.length && !/[aeiouy]/.test(p)) merged[merged.length-1] += p;
    else merged.push(p);
  });
  while (merged.length > 1 && merged[merged.length-1].length <= 2)
    merged[merged.length-2] += merged.pop();
  return merged.length >= 2 ? merged : [w];
}

/* crude but decent syllable splitter, used when there is no pattern to split on */
function syllableSplit(w){
  const comp = compoundSplit(w);
  if (comp) return comp;
  const parts = syllableSplitCore(w);
  if (parts.length === 1) return onsetRime(w);
  return parts.length ? parts : [w];
}

function syllableSplitCore(w){
  const parts = [];
  let cur = '';
  for (let i = 0; i < w.length; i++){
    cur += w[i];
    const next = w[i+1], nn = w[i+2];
    if (!next) break;
    if (cutsDigraph(w, i+1)) continue;
    // VC | CV  (rabbit -> rab|bit)
    if (isVowel(w[i-1]) && !isVowel(w[i]) && next && !isVowel(next) && nn && isVowel(nn) && cur.length >= 2){
      parts.push(cur); cur = ''; continue;
    }
    // V | CV  (open -> o|pen) — only for longer words, and not right at the start
    if (isVowel(w[i]) && next && !isVowel(next) && nn && isVowel(nn) && w.length > 5 && cur.length >= 3){
      parts.push(cur); cur = ''; continue;
    }
  }
  if (cur) parts.push(cur);
  return parts;
}

/* last resort: split a short word into its starting consonants + the rest */
function onsetRime(w){
  if (w.length < 3) return [w];
  let i = 0;
  while (i < w.length && !isVowel(w[i])) i++;
  if (i === 0) i = 1;                    // starts with a vowel
  if (i >= w.length - 1) i = Math.max(1, w.length - 2);
  return [w.slice(0,i), w.slice(i)];
}

/* Split a word into 2–3 flashcard chunks, keeping the week's pattern intact. */
function chunkWord(word, patternId){
  const w = word.toLowerCase();
  const p = PATTERN_BY_ID[patternId];
  if (p){
    const m = matchPattern(w, p);
    if (m){
      const before = w.slice(0, m.i);
      const target = w.slice(m.i, m.i + m.len);
      const after  = w.slice(m.i + m.len);
      const out = [before, target, after].filter(Boolean);
      if (out.length >= 2){
        if (out.every(c => c.length <= 4)) return out;
        // a piece is long and clumsy — try syllabifying the whole word instead,
        // but only if that doesn't chop the week's pattern in half
        const syl = syllableSplit(w);
        if (syl.length >= 2 && syl.every(c => c.length <= 5) &&
            syl.some(c => c.indexOf(target) >= 0)) return syl.slice(0,4);
        return out.slice(0,4);
      }
    }
  }
  return syllableSplit(w).slice(0,4);
}

/* ---------- missing letters (Wednesday) ---------- */

/* level: 1 = blank the pattern only, 2 = pattern + 1, 3 = pattern + 2 */
function makeBlanks(word, patternId, level){
  const w = word.toLowerCase();
  const blanks = new Set();
  const p = PATTERN_BY_ID[patternId];
  const m = p ? matchPattern(w, p) : null;
  if (m && p.custom === 'magic_e'){
    // cake -> c _ k _   (show the consonant, hide the vowel and the magic e)
    blanks.add(m.i); blanks.add(w.length - 1);
  } else if (m){
    for (let i = m.i; i < m.i + m.len && i < w.length; i++) blanks.add(i);
    // for -ing / -ed, also hide the doubled consonant so the 1-1-1 rule gets tested
    if ((p.id === 'ing' || p.id === 'ed') && m.i >= 2 && w[m.i-1] === w[m.i-2] && !isVowel(w[m.i-1])){
      blanks.add(m.i-1);
    }
  }
  if (!blanks.size){
    // blank the vowels
    for (let i = 0; i < w.length; i++) if (isVowel(w[i])) blanks.add(i);
  }
  // never hide more than ~55% of a word, and always leave at least 2 letters showing
  const maxBlanks = Math.max(blanks.size, Math.min(w.length - 2, Math.ceil(w.length * 0.55)));
  const extra = Math.max(0, Math.min((level || 1) - 1, maxBlanks - blanks.size));
  if (extra > 0){
    // deterministic "random": pick spread-out positions not already blanked
    const free = [];
    for (let i = 1; i < w.length; i++) if (!blanks.has(i)) free.push(i);
    let seed = 0; for (let i=0;i<w.length;i++) seed += w.charCodeAt(i);
    for (let k = 0; k < extra && free.length; k++){
      const idx = (seed + k * 7) % free.length;
      blanks.add(free[idx]);
      free.splice(idx,1);
    }
  }
  // never blank the whole word
  if (blanks.size >= w.length) blanks.delete(0);
  return Array.from(blanks).sort((a,b)=>a-b);
}

/* ---------- build a full week ---------- */

function buildWeek(rawText, meta){
  const parsed = parseWordText(rawText);
  const sections = [];

  parsed.forEach(block => {
    if (block.heading){
      // parent gave us an explicit heading — still detect the pattern for rules
      const guess = bestPatternForHeading(block.heading, block.words);
      sections.push({ patternId: guess, label: block.heading, words: block.words });
    } else {
      groupWords(block.words).forEach(s => sections.push(s));
    }
  });

  return {
    id: (meta && meta.id) || 'week',
    title: (meta && meta.title) || autoTitle(sections),
    created: (meta && meta.created) || null,
    sections: sections.map(s => {
      const p = patternFor(s.patternId);
      return {
        patternId: s.patternId,
        label: s.label || p.label,
        emoji: p.emoji,
        tip: { title:p.title, rule:p.rule, trick:p.trick },
        words: s.words.map(w => ({
          word: w,
          chunks: chunkWord(w, s.patternId),
          display: w
        }))
      };
    })
  };
}

function trickyPattern(w){
  const t = TRICKY[w];
  const spelled = w.split('').join('-');
  if (t) return { id:'tricky:'+w, label:'the word \u201c'+w+'\u201d', emoji:t.em,
                  title:'\u201c'+t.title+'\u201d', rule:t.rule, trick:t.trick };
  return { id:'tricky:'+w, label:'the word \u201c'+w+'\u201d', emoji:'\ud83d\udc9b',
    title:'\u201c'+w+'\u201d is a heart word',
    rule:'This one doesn\'t follow a spelling rule — you learn it by heart, like a friend\'s name.',
    trick:'Look \u00b7 Say \u00b7 Cover \u00b7 Write \u00b7 Check. Now spell it out loud: <b>'+spelled+'</b>' };
}

function patternFor(id){
  if (PATTERN_BY_ID[id]) return PATTERN_BY_ID[id];
  if (id && id.indexOf('tricky:') === 0) return trickyPattern(id.slice(7));
  return MISC_PATTERN;
}

function bestPatternForHeading(heading, words){
  const h = heading.toLowerCase().replace(/[^a-z]/g,'');
  // "ie words" -> "iewords"; try to find a pattern id inside it
  let best = null;
  PATTERNS.forEach(p => {
    if (p.g && h.indexOf(p.g) === 0){
      if (!best || p.g.length > PATTERN_BY_ID[best].g.length) best = p.id;
    }
  });
  if (best) return best;
  const g = groupWords(words);
  return g.length ? g[0].patternId : 'misc';
}

function autoTitle(sections){
  const labels = sections.map(s => patternFor(s.patternId).label.replace(' words','').replace('the word ',''));
  if (!labels.length) return 'This Week';
  if (labels.length === 1) return labels[0] + ' words';
  return labels.slice(0,3).join(' · ') + ' words';
}

/* Accepts:
     light night right
     ie words:
     field chief
     - one word per line
     - commas, spaces or newlines
*/
function parseWordText(text){
  const lines = String(text || '').split(/\r?\n/);
  const blocks = [];
  let cur = { heading:null, words:[] };
  lines.forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    const isHeading = /[:：]\s*$/.test(line) ||
                      (/^[a-zA-Z' \-]+$/.test(line) && /\b(words?|list|section|group|pattern|sound)\b/i.test(line) && line.split(/\s+/).length <= 4);
    if (isHeading){
      if (cur.words.length) blocks.push(cur);
      cur = { heading: line.replace(/[:：]\s*$/,'').trim(), words: [] };
      return;
    }
    line.split(/[,;\/\t]+|\s+/).forEach(tok => {
      const w = tok.replace(/[^A-Za-z'\-]/g,'').trim();
      if (w.length >= 2) cur.words.push(w.toLowerCase());
    });
  });
  if (cur.words.length) blocks.push(cur);
  if (!blocks.length) return [];
  // dedupe across blocks
  const seen = {};
  blocks.forEach(b => b.words = b.words.filter(w => (seen[w] ? false : (seen[w]=1, true))));
  return blocks.filter(b => b.words.length);
}

/* ---------------- sound effects ---------------- */
let AC = null;
function actx(){
  if (!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if (AC && AC.state === 'suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function blip(freq, start, dur, type, vol, slideTo){
  const c = actx(); if (!c) return;
  const t0 = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol == null ? .22 : vol, t0 + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + .03);
}
function hiss(start, dur, vol){
  const c = actx(); if (!c) return;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = c.createBufferSource(); src.buffer = buf;
  const g = c.createGain(); g.gain.value = vol == null ? .12 : vol;
  src.connect(g); g.connect(c.destination);
  src.start(c.currentTime + start);
}

   list is ordered to match his pronunciation as closely as possible — en-GB
   first, then other British-sounding voices, then anything English. */
const VOICE_SETS = {
  male:   ['Daniel','Oliver','Arthur','Ryan','Google UK English Male','Microsoft Ryan',
           'Alex','Aaron','Tom','Fred','Google US English','Microsoft Guy'],
  female: ['Serena','Kate','Martha','Stephanie','Google UK English Female','Microsoft Sonia',
           'Moira','Fiona','Karen','Samantha','Ava','Allison','Microsoft Aria']
};

/* turn our little HTML rule strings into something a voice reads naturally */
/* find the best available voice for the chosen sex */
function pickVoiceFor(sex){
  const ov = (DB && DB.voicePick && DB.voicePick[sex]);
  if (ov){
    const hit = ALL_VOICES.find(v => v.name === ov);
    if (hit) return hit;
  }
  const want = VOICE_SETS[sex] || VOICE_SETS.male;
  for (const name of want){
    const hit = ALL_VOICES.find(v => v.name.toLowerCase().indexOf(name.toLowerCase()) >= 0);
    if (hit) return hit;
  }
  // nothing matched by name — prefer a British voice, else the best-scoring one
  return ALL_VOICES.find(v => /en-GB/i.test(v.lang)) || ALL_VOICES[0] || null;
}
function setVoiceSex(sex){
  DB.voiceSex = sex;
  VOICE = pickVoiceFor(sex);
  save();

function speakable(html){
  return String(html)
    .replace(/<[^>]+>/g, '')
    .replace(/\s*→\s*/g, ' becomes ')
    .replace(/\s*\+\s*/g, ' plus ')
    .replace(/\s*=\s*/g, ' makes ')
    .replace(/[—–]/g, ', ')
    .replace(/\s*·\s*/g, '. ')
    .replace(/\u2019/g, "'")
    .replace(/\u201c|\u201d/g, '')
    .replace(/\s*\/\s*/g, ' ')
    .replace(/\s+/g, ' ')
    .replace(/\s+([,.!?])/g, '$1')
    .replace(/,\s*,/g, ',')
    .replace(/\s*\.\s*\./g, '.')
    .replace(/([!?])\./g, '$1')                       // no "!." after a title
    .replace(/\b([a-z])(?:-([a-z]))+\b/gi, m => m.split('-').join(', '))  // s-a-i-d -> s, a, i, d
    .replace(/([a-z0-9)!?])\s*$/i, m => /[.!?]$/.test(m) ? m : m + '.')
    .trim();
}
function speed(){ return (DB && DB.rate) ? DB.rate : .85; }
function initVoices(){
  if (!('speechSynthesis' in window)) return;
  const pick = () => {
    const vs = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    if (!vs.length) return;
    // score voices so we land on the most human-sounding one available
    const score = v => {
      const n = (v.name || '').toLowerCase();
      let s = 0;
      if (/enhanced|premium|neural|natural|wavenet/.test(n)) s += 60;   // the good iOS/Android downloads
      if (/siri/.test(n)) s += 45;
      if (/samantha|ava|allison|susan|nicky|zoe|joelle|noelle|evan|tom/.test(n)) s += 25;
      if (/google/.test(n)) s += 22;
      if (/karen|moira|tessa|daniel|serena|fiona/.test(n)) s += 12;     // fine, but not US
      if (/en-us/i.test(v.lang)) s += 14;
      if (/en-gb/i.test(v.lang)) s += 4;
      if (v.localService) s += 4;
      // the old novelty / robotic voices
      if (/compact|eloquence|fred|albert|zarvox|whisper|bells|boing|bad news|good news|junior|organ|trinoids|bubbles|cellos|deranged|hysterical|pipe|princess|ralph|bahh|wobble|superstar|jester|rocko|shelley|sandy|grandma|grandpa|eddy|flo|reed|rishi/.test(n)) s -= 80;
      return s;
    };
    ALL_VOICES = vs.slice().sort((a,b) => score(b) - score(a));
    VOICE = pickVoiceFor((DB && DB.voiceSex) || 'male');

}
function say(text, opts){

  const u = new SpeechSynthesisUtterance(String(text));
  u.rate = (opts.rate != null ? opts.rate : .88) * speed();
  u.pitch = opts.pitch != null ? opts.pitch : 1.0;
  u.lang = 'en-US';
  if (VOICE) u.voice = VOICE;
  if (opts.onend) u.onend = opts.onend;
  try{ speechSynthesis.speak(u); }catch(e){ if(opts.onend) opts.onend(); }
  return u;
}

function stopSpeech(){
  SAY_TIMERS.forEach(clearTimeout); SAY_TIMERS = [];

}
function sayWord(w, opts){ stopSpeech(); return say(w, opts); }
/* sentences sound robotic when they're dragged out — read prose at normal speed */
function sayRule(html, opts){
  stopSpeech();
  return say(speakable(html), Object.assign({ rate:1.02, pitch:1.0 }, opts || {}));
}

/* iOS quietly ignores small rate changes, so "slowly" also breaks the word into
   its chunks with real pauses — which is more useful anyway. */
function saySlow(word){
  stopSpeech();
  const parts = speechSyllables(word);          // real syllables, never letters
  let t = 0;
  if (parts.length > 1){
    parts.forEach(p => {
      SAY_TIMERS.push(setTimeout(() => say(p, { rate:.62 }), t));
      t += 780 + p.length * 130;
    });
    SAY_TIMERS.push(setTimeout(() => say(word, { rate:.62 }), t + 300));
  } else {
    // one-beat word: stretch it out rather than chopping it up
    SAY_TIMERS.push(setTimeout(() => say(word, { rate:.4 }), 0));
    SAY_TIMERS.push(setTimeout(() => say(word, { rate:.55 }), 1500));
  }
}
function sayLetters(w){
  stopSpeech();
  let t = 0;
  w.split('').forEach(c => {
    SAY_TIMERS.push(setTimeout(() => say(c === 'a' ? 'ay' : c, { rate:.6 }), t));
    t += 620;
  });
  SAY_TIMERS.push(setTimeout(() => say(w, { rate:.6 }), t + 300));
}

/* ---------------- ui helpers ---------------- */
const $ = s => document.querySelector(s);
const app = () => document.getElementById('app');
function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function copyText(txt, okMsg){
  const fail = () => toast('Ready — long-press the box to copy');
  try{

      navigator.clipboard.writeText(txt).then(()=>toast(okMsg), fail);

function toast(msg, ms){
  const t = el('<div class="toast">'+msg+'</div>');
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),320); }, ms||1900);
}

function popup(html, onClose){
  const p = el('<div class="pop"><div class="inner">'+html+'</div></div>');
  document.body.appendChild(p);
  p.addEventListener('click', e => {
    if (e.target.dataset && e.target.dataset.close !== undefined){
      p.remove(); if (onClose) onClose();
    }
  });
  return p;
}

function confetti(n){
  const c = el('<div class="confetti"></div>');
  const cols = ['#ff5fa2','#ffc93c','#22c98b','#3ba9ff','#a855f7','#ff9445'];
  for (let i = 0; i < (n||70); i++){
    const s = document.createElement('i');
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = '-20px';
    s.style.background = cols[i % cols.length];
    s.style.animationDuration = (1.6 + Math.random()*1.6) + 's';
    s.style.animationDelay = (Math.random()*.5) + 's';
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(()=>c.remove(), 4200);
}

function cheer(){
  const s = ['Awesome!','Nice one!','You got it!','Brilliant!','Superstar!','Yes!','Perfect!','Amazing!','Way to go!'];
  return s[Math.floor(Math.random()*s.length)];
}
function encourage(){
  const s = ['Almost! Try again.','So close!','Not quite — have another go.','Keep going, you\'ve got this!'];
  return s[Math.floor(Math.random()*s.length)];
}

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

    '<div class="em">🔒</div><h2>Grown-ups only</h2>'+

/* apply a base64 week payload (from a code or a #w= link). returns true on success */
function applyWeekPayload(code){
  try{
    const d = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (d.v === 2 && d.kids && d.kids.length){
      d.kids.forEach((entry, i) => {
        const match = DB.kids.find(k => k.name.toLowerCase().trim() === String(entry.n||'').toLowerCase().trim())
                   || DB.kids[i];
        if (match) DB.weekRawByKid[match.id] = entry.w;
      });
      DB.weekRaw = d.kids[0].w;
    } else if (d.pk){
      DB.weekRawByKid = d.r;
    } else {
      DB.weekRaw = d.r;
      DB.kids.forEach(k => DB.weekRawByKid[k.id] = d.r);
    }
    DB.weekId = d.id || ('w'+Date.now());
    logWeek(); save();
    return true;
  }catch(e){ return false; }
}

/* how the spelling-bee list is going */
function beeLogHtml(k){
  const raw = (DB.beeByKid && DB.beeByKid[k.id]) || '';
  if (!String(raw).trim()) return '';
  let words = [];
  try{ const wk = buildWeek(raw, {}); wk.sections.forEach(s2 => s2.words.forEach(w => words.push(w.word))); }
  catch(e){ return ''; }
  const bkey = (DB.beeId||'bee1') + ':' + (((DB.beeTargetByKid&&DB.beeTargetByKid[k.id])||DB.beeTarget||'') || 'open');
  const bp = (k.bee && (k.bee[bkey] || k.bee[DB.beeId])) || { stats:{} };
  const st = w => bp.stats[w] || {r:0,x:0,run:0,seen:0};
  const mastered = words.filter(w => st(w).run >= 3);
  const shaky = words.filter(w => st(w).x > 0 && st(w).run < 3);
  const untouched = words.filter(w => !st(w).seen);
  const tgt = (DB.beeTargetByKid && DB.beeTargetByKid[k.id]) || DB.beeTarget || '';
  const days = tgt
    ? Math.max(0, Math.round((new Date(tgt) - new Date(new Date().toISOString().slice(0,10)))/86400000))
    : null;
  return '<h3 style="margin-top:16px;font-size:17px">🐝 Spelling Bee</h3>'+
    '<div class="muted" style="margin-bottom:6px">'+
      (days != null ? days+' day'+(days===1?'':'s')+' to go · ' : '')+
      mastered.length+' of '+words.length+' mastered</div>'+
    '<div class="bar" style="margin-bottom:8px"><i style="width:'+
      Math.round(100*mastered.length/Math.max(1,words.length))+'%"></i></div>'+
    (shaky.length ? '<p class="muted"><b style="color:var(--red)">Needs work:</b> '+shaky.map(esc).join(', ')+'</p>' : '')+
    (untouched.length ? '<p class="muted"><b>Not started yet:</b> '+untouched.length+' word'+(untouched.length===1?'':'s')+'</p>' : '');
}

/* ============ reusable typing round ============ */
/* opts: {word, patternId, blanks(null=all), showWord, hintAudio, onDone(ok,tries)} */
function typingRound(host, opts){
  const word = opts.word.toLowerCase();
  const all = opts.blanks == null;
  const blanks = all ? word.split('').map((_,i)=>i) : opts.blanks;
  const filled = {};
  let tries = 0, locked = false;

  const boxes = el('<div class="boxes"></div>');
  host.appendChild(boxes);
  const kb = buildKeyboard(onKey);
  host.appendChild(kb);

  function cursor(){ for (const i of blanks) if (!filled[i]) return i; return -1; }

  function draw(state){
    boxes.innerHTML = '';
    const cur = cursor();
    for (let i=0;i<word.length;i++){
      const isBlank = blanks.indexOf(i) >= 0;
      let cls = 'lbox', ch = word[i];
      if (isBlank){
        cls += ' blank';
        ch = filled[i] || '';
        if (i === cur && !state) cls += ' cur';
        if (state === 'good') cls += ' good';
        if (state === 'bad')  cls += ' bad';
      }
      boxes.appendChild(el('<div class="'+cls+'">'+(ch?esc(ch):'')+'</div>'));
    }
  }

  function onKey(k){
    if (locked) return;
    if (k === 'del'){
      const c = cursor();
      const idx = c === -1 ? blanks[blanks.length-1] : blanks[blanks.indexOf(c)-1];
      if (idx != null) delete filled[idx];
      draw(); return;
    }
    const c = cursor();
    if (c === -1) return;
    filled[c] = k;
    draw();
    if (cursor() === -1) setTimeout(check, 220);
  }

  function check(){
    const ok = blanks.every(i => (filled[i]||'') === word[i]);
    tries++;
    if (ok){
      locked = true; draw('good');
      if (!opts.noStats){ wordStat(word).r++; save(); }
      sfx(tries === 1 ? 'great' : 'good');
      setTimeout(()=>sayWord(word), 260);
      toast('🎉 '+cheer(), 2200);
      setTimeout(()=>opts.onDone(tries === 1, tries), 1500);
    } else {
      draw('bad');
      sfx('wrong');
      if (tries === 1){ if (!opts.noStats) wordStat(word).x++; noteMiss(word); save(); }
      setTimeout(()=>{
        if (tries >= 2){
          locked = true;
          blanks.forEach(i => filled[i] = word[i]);
          draw('good');
          if (opts.noSpell){
            toast('The judges say it\'s <b>'+esc(word)+'</b> — take a good look.', 6000);
            setTimeout(()=>sayWord(word), 300);
          } else {
            toast('Here it is: <b>'+esc(word)+'</b> — spell it out with me!', 6000);
            setTimeout(()=>sayLetters(word), 300);
          }
          setTimeout(()=>opts.onDone(false, tries), 5200);
        } else {
          blanks.forEach(i => { if (filled[i] !== word[i]) delete filled[i]; });
          toast(encourage(), 3200);
          draw();
        }
      }, 700);
    }
  }

  draw();
  return { redraw: draw };
}

function buildKeyboard(onKey){
  const rows = ['qwertyuiop','asdfghjkl','zxcvbnm'];
  const kb = el('<div class="keyboard"></div>');
  rows.forEach((r,ri) => {
    const row = el('<div class="krow"></div>');
    if (ri === 2) { const d = el('<button class="key wide del">⌫ Delete</button>'); d.onclick = ()=>onKey('del'); row.appendChild(d); }
    r.split('').forEach(c => { const b = el('<button class="key">'+c+'</button>'); b.onclick = ()=>{ sfx('key'); onKey(c); }; row.appendChild(b); });
    if (ri === 2) { const s = el('<button class="key wide">\'</button>'); s.onclick = ()=>onKey("'"); row.appendChild(s); }
    kb.appendChild(row);
  });
  return kb;
}

/* ============ misspelling generator (for multiple choice) ============ */
const CONFUSE = { ie:'ei', ei:'ie', igh:'ie', ai:'ay', ay:'ai', ee:'ea', ea:'ee', oa:'ow', ow:'oa',
  oi:'oy', oy:'oi', ou:'ow', au:'aw', aw:'au', ir:'er', er:'ur', ur:'ir', ck:'k', ph:'f',
  tch:'ch', dge:'ge', kn:'n', wr:'r', oo:'u', ue:'oo', ew:'oo', igh2:'ight' };

function misspell(word, patternId){
  const w = word.toLowerCase();
  const out = new Set();
  const p = PATTERN_BY_ID[patternId];
  const m = p ? matchPattern(w, p) : null;
  if (m && CONFUSE[p.g]) out.add(w.slice(0,m.i) + CONFUSE[p.g] + w.slice(m.i+m.len));
  if (m && p.g.length > 1) out.add(w.slice(0,m.i) + p.g.split('').reverse().join('') + w.slice(m.i+m.len));
  // double / undouble a consonant
  const dbl = /([bcdfgklmnprstz])\1/.exec(w);
  if (dbl) out.add(w.replace(dbl[0], dbl[1]));
  else {
    for (let i=1;i<w.length-1;i++){
      if (!isVowel(w[i]) && isVowel(w[i-1])){ out.add(w.slice(0,i)+w[i]+w.slice(i)); break; }
    }
  }
  // drop a silent-ish letter
  if (/e$/.test(w) && w.length > 3) out.add(w.slice(0,-1));
  // swap two middle letters
  if (w.length > 4){ const i = Math.floor(w.length/2); out.add(w.slice(0,i-1)+w[i]+w[i-1]+w.slice(i+1)); }
  return Array.from(out).filter(x => x !== w && x.length > 1);
}

/* mic level meter — no speech recognition, just "did you make noise?" */
let micStream = null, micCtx = null, micRaf = null;
function startMic(bar, note, onSpoke){
  const hide = () => {
    if (note) note.textContent = '';
    const m = bar && bar.parentNode; if (m) m.style.display = 'none';
  };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ hide(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
    micStream = stream;
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(stream);
    const an = micCtx.createAnalyser(); an.fftSize = 512;
    src.connect(an);
    const data = new Uint8Array(an.frequencyBinCount);
    let loudFrames = 0;
    const tick = () => {
      an.getByteFrequencyData(data);
      let sum = 0; for (let i=0;i<data.length;i++) sum += data[i];
      const avg = sum/data.length;
      const pct = Math.min(100, Math.round(avg*2.6));
      if (bar) bar.style.width = pct + '%';
      if (avg > 20){ loudFrames++; if (note) note.textContent = '🗣️ I can hear you — great reading!'; }
      else loudFrames = Math.max(0, loudFrames-1);
      if (loudFrames > 45){ if (onSpoke) onSpoke(); return; }
      micRaf = requestAnimationFrame(tick);
    };
    tick();
  }).catch(hide);
}
function stopMic(){
  if (micRaf) cancelAnimationFrame(micRaf); micRaf = null;
  if (micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
  if (micCtx){ try{micCtx.close();}catch(e){} micCtx = null; }
}

/* ============================================================
   TUESDAY — Sound & Build (chunk flashcards)
   ============================================================ */
function actTuesday(a, d){
  const host = el('<div></div>'); a.appendChild(host);
  let queue = [];
  WEEK.sections.forEach(s => { queue.push({tip:s}); s.words.forEach(w => queue.push({word:w, sec:s})); });
  let qi = 0, correct = 0, total = WEEK.allWords.length, firstTry = 0;
  const dd = dots(total, a);
  let di = 0;

  function next(){
    if (qi >= queue.length){
      if (correct === total) award('builder');
      return finishScreen(d, firstTry, total);
    }
    const item = queue[qi++];
    host.innerHTML = '';
    if (item.tip){
      const c = el('<div class="card center">'+
        '<div style="font-size:44px">'+item.tip.emoji+'</div>'+
        '<h2 style="font-size:23px">'+esc(item.tip.label)+'</h2>'+
        '<div class="tip"><h3>💡 '+item.tip.tip.title+'</h3>'+
          '<p>'+item.tip.tip.rule+'</p><p class="trick">'+item.tip.tip.trick+'</p></div>'+
        '<button class="btn" id="hear">🔊 Hear the rule</button>'+
        '<button class="btn big blue" id="go" style="margin-top:10px">Start this group →</button></div>');
      const rt = item.tip.tip.title + '. ' + item.tip.tip.rule + ' ' + item.tip.tip.trick;
      c.querySelector('#hear').onclick = () => sayRule(rt);
      c.querySelector('#go').onclick = () => { sfx('tap'); next(); };
      host.appendChild(c);
      setTimeout(()=>sayRule(rt), 400);
      return;
    }
    build(item);
  }

  function build(item){
    const w = item.word;
    const chunks = w.chunks;
    const pool = shuffle(chunks.concat(distractors(w, chunks.length >= 3 ? 2 : 3)));
    const placed = [];
    let tries = 0;

    const c = el('<div class="card center">'+
      '<div class="muted">'+item.sec.emoji+' '+esc(item.sec.label)+'</div>'+
      '<div class="speaker" id="sp" style="margin-top:12px">🔊</div>'+
      '<p class="muted" style="margin-top:10px">Listen, then tap the pieces in order to build the word.</p>'+
      '<div class="slots" id="slots"></div>'+
      '<div class="tray" id="tray"></div>'+
      '<div class="row" style="margin-top:14px;justify-content:center">'+
        '<button class="btn grey" id="sl">🐢 Slowly</button>'+
        '<button class="btn grey" id="undo">↩️ Undo</button>'+
      '</div></div>');
    host.appendChild(c);

    const sp = c.querySelector('#sp');
    const play = () => { sp.classList.add('playing'); sayWord(w.word, {onend:()=>sp.classList.remove('playing')}); };
    sp.onclick = play;
    c.querySelector('#sl').onclick = () => saySlow(w.word);
    setTimeout(play, 300);

    const slots = c.querySelector('#slots'), tray = c.querySelector('#tray');

    function drawSlots(state){
      slots.innerHTML = '';
      for (let i=0;i<chunks.length;i++){
        const v = placed[i];
        slots.appendChild(el('<div class="slot'+(v?' filled':'')+(state?' '+state:'')+'">'+(v?esc(v.txt):'')+'</div>'));
      }
    }
    function drawTray(){
      tray.innerHTML = '';
      pool.forEach((txt, i) => {
        const used = placed.some(p => p && p.i === i);
        const b = el('<button class="chunk'+(used?' used':'')+'">'+esc(txt)+'</button>');
        b.onclick = () => {
          if (placed.length >= chunks.length) return;
          sfx('pop');
          placed.push({i, txt});
          drawSlots(); drawTray();
          if (placed.length === chunks.length) setTimeout(check, 250);
        };
        tray.appendChild(b);
      });
    }
    c.querySelector('#undo').onclick = () => { placed.pop(); drawSlots(); drawTray(); };

    function check(){
      const made = placed.map(p=>p.txt).join('');
      tries++;
      if (made === w.word.toLowerCase()){
        wordStat(w.word).r++; save();
        slots.querySelectorAll('.slot').forEach(s => { s.style.borderColor = 'var(--green)'; s.style.background = '#dcfce7'; });
        correct++; if (tries === 1) firstTry++;
        setDot(dd, di++, true);
        sfx(tries === 1 ? 'great' : 'good');
        setTimeout(()=>sayWord(w.word), 260);
        toast('🎉 '+cheer(), 2200);
        setTimeout(next, 1600);
      } else {
        if (tries === 1){ wordStat(w.word).x++; noteMiss(w.word); save(); }
        sfx('wrong');
        slots.querySelectorAll('.slot').forEach(s => s.classList.add('bad'));
        setTimeout(() => {
          if (tries >= 2){
            placed.length = 0;
            chunks.forEach(ch => { const i = pool.indexOf(ch); placed.push({i, txt:ch}); });
            drawSlots(); drawTray();
            toast('Here it is: <b>'+esc(w.word)+'</b> — look at the pieces!', 5200);
            setTimeout(()=>sayLetters(w.word), 300);
            setDot(dd, di++, false);
            setTimeout(next, 4800);
          } else {
            placed.length = 0; drawSlots(); drawTray(); toast(encourage(), 3200);
          }
        }, 650);
      }
    }
    drawSlots(); drawTray();
  }

  function distractors(w, n){
    const others = [];
    WEEK.allWords.forEach(x => { if (x.word !== w.word) others.push.apply(others, x.chunks); });
    const uniq = Array.from(new Set(others)).filter(c => w.chunks.indexOf(c) < 0);
    const extra = ['ing','ed','sh','ck','th','er','ay','ea'].filter(c => w.chunks.indexOf(c) < 0);
    return shuffle(uniq.concat(extra)).slice(0, n);
  }

  next();
}

/* ============================================================
   FRIDAY — Arcade (3 games)
   ============================================================ */
function actFriday(a, d){
  const host = el('<div></div>'); a.appendChild(host);
  const p = prog(); p.games = p.games || {};

  function menu(){
    host.innerHTML = '';
    const played = Object.keys(p.games).length;
    const c = el('<div class="card center">'+
      '<div style="font-size:44px">🎮</div><h2>Arcade</h2>'+
      '<p class="muted">Play all three to finish Friday! ('+played+'/3)</p></div>');
    host.appendChild(c);
    const games = [
      { id:'pop',  em:'🎈', n:'Balloon Pop',  s:'Pop the correct spelling', cls:'pink',  fn:gamePop },
      { id:'scr',  em:'🔀', n:'Scramble',     s:'Put the letters in order', cls:'blue',  fn:gameScramble },
      { id:'spd',  em:'⚡', n:'Speed Match',  s:'Beat the clock',           cls:'orange',fn:gameSpeed },
    ];
    games.forEach(g => {
      const b = el('<button class="btn big '+g.cls+'" style="margin-bottom:10px;justify-content:flex-start;text-align:left">'+
        '<span style="font-size:30px">'+g.em+'</span><span><b>'+g.n+'</b>'+
        '<div style="font-size:13px;font-weight:600;opacity:.9">'+g.s+(p.games[g.id]?' · ✅ best '+p.games[g.id]:'')+'</div></span></button>');
      b.onclick = () => g.fn(g.id);
      host.appendChild(b);
    });
    if (played >= 3){
      const f = el('<button class="btn big green">🏁 Finish Friday</button>');
      f.onclick = () => { award('arcade'); finishScreen(d, 3, 3); };
      host.appendChild(f);
    }
  }

  function record(id, score){
    p.games[id] = Math.max(p.games[id]||0, score); save();
    confetti(50); sfx('win');
    const pp = popup('<div class="em">🎉</div><h2>Score: '+score+'</h2><p class="muted">Nice playing!</p>'+
      '<button class="btn big green" data-close>Back to Arcade</button>');
    pp.addEventListener('click', e => { if (e.target.dataset.close !== undefined) menu(); });
  }

  /* --- Balloon Pop --- */
  function gamePop(id){
    const words = shuffle(WEEK.allWords);
    let i = 0, score = 0;
    step();
    function step(){
      if (i >= words.length) return record(id, score);
      const w = words[i];
      const wrongs = shuffle(misspell(w.word, w.patternId)).slice(0,2);
      const opts = shuffle([w.word].concat(wrongs.length ? wrongs : [w.word.split('').reverse().join('')]));
      host.innerHTML = '';
      const c = el('<div class="card center">'+
        '<div class="muted">🎈 '+(i+1)+' of '+words.length+' · '+score+' points</div>'+
        '<div class="speaker" id="sp" style="margin-top:12px">🔊</div>'+
        '<p style="font-weight:800;font-size:18px;margin-top:14px">Pop the balloon that\'s spelled right!</p>'+
        '<div id="ops" style="margin-top:8px"></div></div>');
      host.appendChild(c);
      c.querySelector('#sp').onclick = () => sayWord(w.word);
      setTimeout(()=>sayWord(w.word), 300);
      const ops = c.querySelector('#ops');
      opts.forEach(o => {
        const b = el('<button class="btn big '+(o===w.word?'pink':'pink')+'" style="margin-bottom:9px">🎈 '+esc(o)+'</button>');
        b.onclick = () => {
          if (o === w.word){ score += 10; wordStat(w.word).r++; b.className='btn big green'; b.textContent='✅ '+o;
                 sfx('pop'); setTimeout(()=>sfx('great'), 90); setTimeout(()=>sayWord(w.word), 320); }
          else { wordStat(w.word).x++; noteMiss(w.word); sfx('wrong'); b.className='btn big red'; b.textContent='❌ '+o;
                 Array.from(ops.children).forEach(x => { if (x.textContent.indexOf(w.word)>=0) x.className='btn big green'; }); }
          save();
          ops.querySelectorAll('button').forEach(x=>x.disabled=true);
          i++; setTimeout(step, 1900);
        };
        ops.appendChild(b);
      });
    }
  }

  /* --- Scramble --- */
  function gameScramble(id){
    const words = shuffle(WEEK.allWords);
    let i = 0, score = 0;
    step();
    function step(){
      if (i >= words.length) return record(id, score);
      const w = words[i].word;
      let letters = shuffle(w.split(''));
      if (letters.join('') === w) letters = letters.reverse();
      const picked = [];
      host.innerHTML = '';
      const c = el('<div class="card center">'+
        '<div class="muted">🔀 '+(i+1)+' of '+words.length+' · '+score+' points</div>'+
        '<p style="font-weight:800;font-size:18px;margin-top:10px">Tap the letters in the right order</p>'+
        '<div class="row" style="justify-content:center;margin:8px 0"><button class="btn grey" id="h">🔊 Hear it</button>'+
        '<button class="btn grey" id="u">↩️ Undo</button></div>'+
        '<div class="boxes" id="ans"></div><div class="tray" id="tr"></div></div>');
      host.appendChild(c);
      c.querySelector('#h').onclick = () => sayWord(w);
      c.querySelector('#u').onclick = () => { picked.pop(); draw(); };
      setTimeout(()=>sayWord(w), 300);
      const ans = c.querySelector('#ans'), tr = c.querySelector('#tr');
      function draw(state){
        ans.innerHTML = '';
        for (let j=0;j<w.length;j++)
          ans.appendChild(el('<div class="lbox blank'+(state||'')+'">'+(picked[j]?esc(picked[j].c):'')+'</div>'));
        tr.innerHTML = '';
        letters.forEach((c2, li) => {
          const used = picked.some(p2 => p2.li === li);
          const b = el('<button class="chunk'+(used?' used':'')+'">'+esc(c2)+'</button>');
          b.onclick = () => { if (picked.length >= w.length) return; sfx('key'); picked.push({li,c:c2}); draw();
            if (picked.length === w.length) setTimeout(check, 220); };
          tr.appendChild(b);
        });
      }
      function check(){
        const made = picked.map(p2=>p2.c).join('');
        if (made === w){ score += 10; wordStat(w).r++; save(); draw(' good'); sfx('great');
          setTimeout(()=>sayWord(w), 250); toast('🎉 '+cheer(), 2000);
          i++; setTimeout(step, 1600); }
        else { wordStat(w).x++; noteMiss(w); save(); draw(' bad'); sfx('wrong'); toast(encourage(), 3000);
          setTimeout(()=>{ picked.length = 0; draw(); }, 900); }
      }
      draw();
    }
  }

  /* --- Speed Match --- */
  function gameSpeed(id){
    let score = 0, left = 45, timer = null;
    const all = WEEK.allWords;
    host.innerHTML = '';
    const c = el('<div class="card center">'+
      '<div class="muted">⚡ Speed Match</div>'+
      '<div style="font-size:34px;font-weight:900" id="clk">45</div>'+
      '<div class="muted">Score: <b id="sc">0</b></div>'+
      '<div class="speaker" id="sp" style="margin-top:10px">🔊</div>'+
      '<p style="font-weight:800;margin-top:12px">Which word did you hear?</p>'+
      '<div id="ops"></div></div>');
    host.appendChild(c);
    timer = setInterval(() => {
      left--; c.querySelector('#clk').textContent = left;
      if (left > 0 && left <= 5) sfx('tick');
      if (left <= 0){ clearInterval(timer); sfx('win'); record(id, score); }
    }, 1000);

    function step(){
      if (left <= 0) return;
      const w = all[Math.floor(Math.random()*all.length)];
      const others = shuffle(all.filter(x=>x.word!==w.word)).slice(0,3).map(x=>x.word);
      const opts = shuffle([w.word].concat(others));
      c.querySelector('#sp').onclick = () => sayWord(w.word);
      sayWord(w.word);
      const ops = c.querySelector('#ops'); ops.innerHTML = '';
      opts.forEach(o => {
        const b = el('<button class="btn big blue" style="margin-bottom:8px">'+esc(o)+'</button>');
        b.onclick = () => {
          if (o === w.word){ score += 5; wordStat(w.word).r++; sfx('good'); b.className = 'btn big green'; }
          else { score = Math.max(0, score-2); wordStat(w.word).x++; noteMiss(w.word); sfx('wrong'); b.className = 'btn big red'; }
          save();
          c.querySelector('#sc').textContent = score;
          ops.querySelectorAll('button').forEach(x=>x.disabled=true);
          setTimeout(step, 700);
        };
        ops.appendChild(b);
      });
    }
    step();
  }

  menu();
}

function actSaturday(a, d){
  const host = el('<div></div>'); a.appendChild(host);
  let pile = trickyWords();
  const fromTricky = pile.length > 0;
  if (!pile.length) pile = shuffle(WEEK.allWords).slice(0, Math.min(6, WEEK.allWords.length));

  let i = 0, hearts = 3, beaten = 0;

  function intro(){
    host.innerHTML = '';
    const c = el('<div class="card center">'+
      '<div style="font-size:52px">⚔️👾</div>'+
      '<h2>Boss Battle!</h2>'+
      '<p class="muted">'+(fromTricky
        ? 'These are the words that tricked you this week. Beat them all!'
        : 'You haven\'t missed any words yet — here\'s a surprise challenge round!')+'</p>'+
      '<div style="margin:14px 0">'+pile.map(w=>'<span class="wordchip">'+esc(w.word)+'</span>').join('')+'</div>'+

    c.querySelector('#go').onclick = () => { sfx('tap'); round(); };
    host.appendChild(c);
  }

  function round(){
    if (hearts <= 0) return lose();
    if (i >= pile.length) return win();
    const w = pile[i];
    host.innerHTML = '';
    const c = el('<div class="card center">'+
      '<div style="font-size:26px">'+'❤️'.repeat(hearts)+'<span style="opacity:.2">'+'🖤'.repeat(3-hearts)+'</span></div>'+
      '<div class="muted">Boss word '+(i+1)+' of '+pile.length+'</div>'+
      '<div class="speaker" id="sp" style="margin-top:12px">🔊</div>'+
      '<p style="font-weight:800;font-size:18px;margin-top:12px">Spell it to land a hit!</p>'+
      '<div class="row" style="justify-content:center;margin:8px 0"><button class="btn grey" id="sl">🐢 Slower</button></div>'+
      '</div>');
    host.appendChild(c);
    c.querySelector('#sp').onclick = () => sayWord(w.word);
    c.querySelector('#sl').onclick = () => sayWord(w.word,{rate:.45});
    setTimeout(()=>sayWord(w.word), 300);
    typingRound(c, {
      word:w.word, patternId:w.patternId, blanks:null,
      onDone: ok => {
        if (ok){ beaten++; sfx('great'); toast('💥 Direct hit!', 2200); }
        else { hearts--; sfx('hurt'); toast('💔 Ouch — you lost a heart!', 2600); }
        i++; setTimeout(round, 1300);
      }
    });
  }

  function win(){
    sfx('win'); award('boss');
    // clear the tricky flags for words that were beaten
    const p = prog();
    pile.forEach(w => { if (p.stats[w.word]) p.stats[w.word].x = 0; });
    save();
    finishScreen(d, beaten, pile.length, '· Tricky pile cleared! 🎯');
  }
  function lose(){
    sfx('lose');
    const p = popup('<div class="em">😵</div><h2>The boss won this round!</h2>'+
      '<p class="muted">You beat '+beaten+' of '+pile.length+' words. Want another go?</p>'+
      '<button class="btn big green" id="again">🔁 Try again</button>'+
      '<button class="btn big grey" style="margin-top:8px" data-close>Back to the map</button>');
    p.querySelector('#again').onclick = () => { p.remove(); hearts=3; i=0; beaten=0; pile=shuffle(pile); round(); };
    p.addEventListener('click', e => { if (e.target.dataset.close !== undefined) go('home'); });
  }

  intro();
}

function actSunday(a, d){
  const host = el('<div></div>'); a.appendChild(host);

  function intro(){

    const c = el('<div class="card center">'+
      '<div class="rocketbox"><div class="rk" style="bottom:0%">🚀</div>'+
        '<div class="moon">🌕</div><div class="rstar s1">✨</div><div class="rstar s2">⭐</div></div>'+

  function next(){

    host.innerHTML = '';
    const c = el('<div class="card center">'+
      '<div class="row" style="justify-content:space-between;align-items:center">'+
        '<span class="muted">🚀 '+(i+1)+' / '+words.length+'</span>'+
        '<span class="combo'+(combo>1?' hot':'')+'">'+(combo>1 ? '🔥 '+combo+' in a row!' : '&nbsp;')+'</span>'+
      '</div>'+
      '<div class="rocketbox mini"><div class="rk" style="bottom:'+Math.min(78,pct*.78)+'%">🚀</div>'+
        '<div class="moon">🌕</div><div class="rstar s1">✨</div><div class="rstar s2">⭐</div></div>'+
      '<div class="fuel"><i style="width:'+pct+'%"></i></div>'+
      '<div class="fuel-lbl muted">fuel '+pct+'%</div>'+
      '<div class="speaker" id="sp" style="margin-top:10px">🔊</div>'+
      '<p style="font-weight:800;font-size:18px;margin-top:12px">Spell the word you hear</p>'+
      '<div class="row" style="justify-content:center;margin:8px 0">'+
        '<button class="btn grey" id="sl">🐢 Slowly</button></div></div>');
    host.appendChild(c);
    const sp = c.querySelector('#sp');
    const play = () => { sp.classList.add('playing'); sayWord(w.word, {onend:()=>sp.classList.remove('playing')}); };
    sp.onclick = play;
    c.querySelector('#sl').onclick = () => saySlow(w.word);
    setTimeout(play, 350);

    typingRound(c, {
      word:w.word, patternId:w.patternId, blanks:null,
      onDone: ok => {
        if (ok){
          right++; fuel++; combo++; best = Math.max(best, combo);
          sfx('combo', combo);
          if (combo === 3) toast('🔥 Three in a row! Double stars!', 2600);
          if (combo === 5) toast('🔥🔥 FIVE in a row — you\'re on fire!', 2600);
        } else { combo = 0; }
        i++; next();
      }
    });
  }

  function launch(){
    host.innerHTML = '';
    const perfect = right === words.length;
    const pct = Math.round(100*right/words.length);
    const c = el('<div class="card center">'+
      '<div class="rocketbox big"><div class="rk" id="rk" style="bottom:2%">🚀</div>'+
        '<div class="moon">🌕</div><div class="rstar s1">✨</div><div class="rstar s2">⭐</div>'+
        '<div class="rstar s3">💫</div></div>'+
      '<h2 id="cd" style="font-size:34px;margin-top:10px">3…</h2></div>');
    host.appendChild(c);
    const rk = c.querySelector('#rk'), cd = c.querySelector('#cd');
    const seq = ['3…','2…','1…','LIFT OFF! 🚀'];
    seq.forEach((t, n) => setTimeout(() => {
      cd.textContent = t;
      if (n < 3) sfx('tick');
      if (n === 3){
        sfx('launch'); rk.style.transition = 'bottom 2.2s cubic-bezier(.5,0,.7,1)';
        rk.style.bottom = '82%'; confetti(120);
      }
    }, n*750));
    setTimeout(() => {
      if (perfect) award('perfect');
      cd.innerHTML = perfect ? '🌕 You made it to the moon!' : '⭐ '+pct+'% of the way there!';
      setTimeout(() => finishScreen(d, right, words.length,
        (perfect ? '· PERFECT! 💯 ' : '') + (best >= 3 ? '· best combo 🔥'+best : '')), 1600);
    }, 3000 + 2200);
  }

  intro();
}

<script>
/* ===================== SPELLING QUEST — Bee Prep =====================
   A long word list with a target date. The app splits it into weekly
   sections, carries missed words forward, and in the last fortnight
   swings the balance towards misses while bringing back the words they
   had already mastered, so nothing goes stale.
   Thursday's "Spelling Bee" activity is a different thing and untouched.
   ===================================================================== */

const BEE_SESSION_MS = 10 * 60 * 1000;      // the 10-minute cap
const BEE_MASTER_RUN = 3;                   // right this many times in a row = mastered
const BEE_FINAL_DAYS = 14;                  // "the final fortnight"

let BEE = null;

function beeRawFor(k){ return (DB.beeByKid && DB.beeByKid[k.id]) || ''; }
function beeTargetFor(k){
  return (DB.beeTargetByKid && k && DB.beeTargetByKid[k.id]) || DB.beeTarget || '';
}
function beeHasList(k){ return !!String(beeRawFor(k||kid())).trim(); }

function buildBee(){
  const raw = beeRawFor(kid());
  BEE = buildWeek(raw, { id:'bee' });
  BEE.allWords = [];
  BEE.sections.forEach(s => s.words.forEach(w => BEE.allWords.push(
    Object.assign({}, w, { patternId:s.patternId, section:s.label, tip:s.tip, emoji:s.emoji })
  )));
  BEE.byWord = {};
  BEE.allWords.forEach(w => BEE.byWord[w.word] = w);
  return BEE;
}

/* ---------------- per-child bee progress ---------------- */
function beeProg(){
  const k = kid();
  k.bee = k.bee || {};
  const id = (DB.beeId || 'bee1') + ':' + (beeTargetFor(k) || 'open');
  if (!k.bee[id]) k.bee[id] = { stats:{}, days:{}, started:new Date().toISOString().slice(0,10) };
  return k.bee[id];
}
function beeStat(w){
  const p = beeProg();
  if (!p.stats[w]) p.stats[w] = { r:0, x:0, run:0, seen:0 };
  return p.stats[w];
}
function beeMastered(w){ const s = beeProg().stats[w]; return !!(s && s.run >= BEE_MASTER_RUN); }
function beeSeen(w){ const s = beeProg().stats[w]; return !!(s && s.seen); }
function beeShaky(w){ const s = beeProg().stats[w]; return !!(s && s.x > 0 && s.run < BEE_MASTER_RUN); }

function beeMark(word, ok){
  const s = beeStat(word);
  s.seen++;
  if (ok){ s.r++; s.run++; }
  else { s.x++; s.run = 0; }
  save();
}

/* ---------------- the schedule ---------------- */
function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function today(){ return new Date().toISOString().slice(0,10); }

function beePlan(){
  const p = beeProg();
  const words = BEE.allWords.map(w => w.word);
  const target = beeTargetFor(kid());
  const daysLeft = target ? Math.max(0, daysBetween(today(), target)) : null;
  const started = p.started || today();
  const weekIndex = Math.max(0, Math.floor(daysBetween(started, today()) / 7));

  // how many weeks of NEW material: everything except the last fortnight
  let totalWeeks = daysLeft != null ? Math.ceil((daysLeft + 1) / 7) : 4;
  let newWeeks = Math.max(1, totalWeeks - 2);
  const perChunk = Math.max(1, Math.ceil(words.length / newWeeks));

  const chunks = [];
  for (let i = 0; i < words.length; i += perChunk) chunks.push(words.slice(i, i + perChunk));

  const finalStretch = daysLeft != null && daysLeft <= BEE_FINAL_DAYS;
  const ci = Math.min(weekIndex, chunks.length - 1);
  const introduced = chunks.slice(0, (finalStretch ? chunks.length : ci + 1)).flat();

  return {
    words, chunks, chunkIndex: ci, totalWeeks, newWeeks, daysLeft, finalStretch,
    thisWeek: finalStretch ? [] : (chunks[ci] || []),
    introduced,
    mastered: words.filter(beeMastered),
    shaky: introduced.filter(beeShaky),
    unseen: (finalStretch ? words : (chunks[ci] || [])).filter(w => !beeSeen(w))
  };
}

/* Build today's practice list. Missed words lead; new words next; mastered
   words rotate through across the days so the whole list stays warm. */
function beeSessionWords(){
  const plan = beePlan();
  const out = [];
  const push = arr => arr.forEach(w => { if (out.indexOf(w) < 0) out.push(w); });

  const rot = Math.floor(Date.now() / 86400000);   // changes once a day
  const slice = (arr, n) => {
    if (arr.length <= n) return arr.slice();
    const start = (rot * n) % arr.length;
    const r = [];
    for (let i = 0; i < n; i++) r.push(arr[(start + i) % arr.length]);
    return r;
  };

  if (plan.finalStretch){
    push(plan.shaky.slice(0, 10));               // misses get the volume
    push(slice(plan.mastered, 6));               // but the good ones come back for review
    push(plan.words.filter(w => !beeSeen(w)).slice(0, 3));
  } else {
    push(plan.shaky.slice(0, 6));
    push(plan.unseen.slice(0, 6));
    push(slice(plan.introduced.filter(w => !beeShaky(w) && beeSeen(w)), 4));
  }
  // top the session up so it's always worth sitting down for
  const MIN = 10;
  if (out.length < MIN) push(slice(plan.introduced.filter(w => out.indexOf(w) < 0), MIN - out.length));
  if (out.length < MIN) push(slice(plan.words.filter(w => out.indexOf(w) < 0), MIN - out.length));
  return shuffle(out).map(w => BEE.byWord[w]).filter(Boolean);
}
